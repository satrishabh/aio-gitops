# Managed by AIO platform - image.tag is updated by CI / promotions
image:
  repository: ghcr.io/satrishabh/checkaccess
  tag: "a0c83c1711fc"
# 0 until a real image is deployed (avoids pulling the placeholder tag)
replicaCount: 0
imagePullSecrets:
  - name: ghcr-pull
pdb:
  enabled: false
ingress:
  enabled: true
  host: checkaccess-dev.52.140.55.184.nip.io
  className: aio-azure
  controller: traefik
env: []
resources:
  requests: {cpu: "50m", memory: "128Mi"}
  limits: {cpu: "100m", memory: "512Mi"}
scaledDown: true
spot:
  enabled: true
  provider: aks           # tolerate the AKS spot pool; pods may land there when the regular node is full
