# Managed by AIO platform - image.tag is updated by CI / promotions
image:
  repository: ghcr.io/satrishabh/my-spring-boot
  tag: "0.0.0"
# 0 until a real image is deployed (avoids pulling the placeholder tag)
replicaCount: 0
imagePullSecrets:
  - name: ghcr-pull
pdb:
  enabled: false
ingress:
  enabled: true
  host: my-spring-boot.34.180.3.18.nip.io
  tls: true
  issuer: gts
  forceHttps: true
  externalDns: false
env: []
resources:
  requests: { cpu: "50m", memory: "128Mi" }
  limits: { cpu: "500m", memory: "512Mi" }
blueGreen:
  enabled: true
  previewHost: my-spring-boot-preview.34.180.3.18.nip.io
