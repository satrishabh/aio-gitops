nameOverride: sarvaika-blog
replicaCount: 1
image:
  repository: ghcr.io/satrishabh/sarvaika-blog
  tag: "5f720b42b51e"
imagePullSecrets:
  - name: ghcr-pull
containerPort: 8080
envFrom:
  - secretRef:
      name: sarvaika-blog-runtime
env:
  - name: JAVA_TOOL_OPTIONS
    value: "-XX:MaxRAMPercentage=65"
  - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
    value: "3"
resources:
  requests: {cpu: 100m, memory: 384Mi}
  limits: {cpu: 1000m, memory: 768Mi}
probes:
  liveness:
    path: /health
    initialDelaySeconds: 120
  readiness:
    path: /health
    initialDelaySeconds: 20
ingress:
  enabled: true
  className: nginx
  host: sarvaika-blog-dev.34.180.3.18.nip.io
  tls: true
  issuer: gts
  forceHttps: true
  externalDns: false
