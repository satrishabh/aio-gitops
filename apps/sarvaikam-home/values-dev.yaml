# Azure AKS 'creative' (dev). Managed by AIO platform - image.tag is updated by CI / promotions.
# Mirrors the live Azure release adopted by Argo CD on 2026-11-14 (empty diff). Secret values live in-cluster only.
image:
  repository: ghcr.io/satrishabh/sarvaikam-home
  tag: sha256:e3c2bdd31be308169d9cedfc8f33e1480597964056caa56dfff89eb8cfa01983
imagePullSecrets:
- name: ghcr-pull
ingress:
  className: aio-azure
  enabled: false
  controller: traefik
nameOverride: sarvaikam-home
podSecurityContext:
  fsGroup: 10001
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
replicaCount: 1
routes:
  - host: sarvaikam.com
    path: "/"
    tls: true
    issuer: letsencrypt-azure
    certOwner: true
    forceHttps: true
    wwwRedirect: false
    stripPrefix: false
    externalDns: false
