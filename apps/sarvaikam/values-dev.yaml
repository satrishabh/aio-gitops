# Azure AKS 'creative' (dev). Managed by AIO platform - image.tag is updated by CI / promotions.
# Mirrors the live Azure release adopted by Argo CD on 2026-11-14 (empty diff). Secret values live in-cluster only.
env:
- name: APP_ENV
  value: staging
- name: EMBEDDED_DB
  value: "false"
- name: DB_HOST
  value: postgres-rehearsal.aio-validation.svc.cluster.local
- name: DB_PORT
  value: "5432"
- name: DB_SSLMODE
  value: verify-full
- name: POSTGRES_DB
  value: aio_rehearsal
- name: POSTGRES_USER
  value: learn_rehearsal
- name: DB_SYNCHRONIZE
  value: "false"
- name: DB_POOL_SIZE
  value: "3"
- name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
  value: "3"
- name: PGSSLROOTCERT
  value: /etc/aio-db/ca.crt
- name: NODE_EXTRA_CA_CERTS
  value: /etc/aio-db/ca.crt
- name: DB_URL
  value: jdbc:postgresql://postgres-rehearsal.aio-validation.svc.cluster.local:5432/aio_rehearsal?sslmode=verify-full&sslrootcert=/etc/aio-db/ca.crt&currentSchema=sarvaikam
- name: SPRING_FLYWAY_DEFAULT_SCHEMA
  value: sarvaikam
- name: SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA
  value: sarvaikam
- name: REELS_DB_URL
  value: jdbc:postgresql://postgres-rehearsal.aio-validation.svc.cluster.local:5432/aio_rehearsal?sslmode=verify-full&sslrootcert=/etc/aio-db/ca.crt&currentSchema=sarvaikam_reels
- name: REELS_DB_USER
  value: reels_rehearsal
- name: PROFILE_CLIENT_ID
  value: sarvaikam-learn
envFrom:
- secretRef:
    name: sarvaikam-profile-runtime
- secretRef:
    name: sarvaikam-db
extraVolumeMounts:
- mountPath: /etc/aio-db
  name: db-trust
  readOnly: true
- mountPath: /etc/sarvaikam/proxy_headers
  name: nginx-compat
  readOnly: true
  subPath: proxy_headers
extraVolumes:
- configMap:
    name: rehearsal-db-trust
  name: db-trust
- configMap:
    name: learn-nginx-proxy-compat
  name: nginx-compat
image:
  repository: ghcr.io/satrishabh/sarvaikam
  tag: sha256:9b6605c124fd837aa55006ab6ef32571f97288876a0f1273968bc70ee1cb94fb
imagePullSecrets:
- name: ghcr-pull
ingress:
  className: aio-azure
  enabled: false
nameOverride: sarvaikam
podSecurityContext:
  fsGroup: 10001
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
probes:
  liveness:
    initialDelaySeconds: 180
    path: /health
  readiness:
    initialDelaySeconds: 5
    path: /ready
replicaCount: 1
resources:
  limits:
    cpu: "1"
    memory: 2Gi
  requests:
    cpu: 100m
    memory: 768Mi
routes: []
