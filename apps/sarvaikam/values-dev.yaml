# Managed by AIO platform - image.tag is updated by CI / promotions
image:
  repository: ghcr.io/satrishabh/sarvaikam
  tag: "f8e850ea9c32"
replicaCount: 1
pdb:
  enabled: false
ingress:
  enabled: true
  host: sarvaikam-dev.34.180.3.18.nip.io
  tls: false
  issuer: gts
  forceHttps: true
  externalDns: false
imagePullSecrets:
  - name: ghcr-pull
# Persistent dev database: Cloud SQL aio-002 via the in-namespace proxy
# (deploy/dev/cloudsql-proxy.yaml in the sarvaikam repo). Password: secret sarvaikam-db.
env:
  - {name: APP_ENV, value: dev}
  - {name: EMBEDDED_DB, value: "false"}
  - {name: DB_HOST, value: sarvaikam-cloudsql-proxy}
  - {name: DB_PORT, value: "5432"}
  - {name: DB_SSLMODE, value: disable}
  - {name: POSTGRES_DB, value: sarvaikam}
  - {name: POSTGRES_USER, value: sarvaikam_app}
  - {name: REELS_DB_URL, value: "jdbc:postgresql://sarvaikam-cloudsql-proxy:5432/sarvaikam_reels?sslmode=disable"}
  - {name: REELS_DB_USER, value: sarvaikam_app}
envFrom:
  - secretRef:
      name: sarvaikam-profile-runtime
  - secretRef:
      name: sarvaikam-db
resources:
  requests: {cpu: "50m", memory: "128Mi"}
  limits: {cpu: "1000m", memory: "2048Mi"}
# Managed by the AIO platform Domains tab - edit there, not here
routes:
  - host: learn.sarvaikam.com
    path: "/"
    tls: true
    issuer: gts
    certOwner: true
    forceHttps: true
    wwwRedirect: false
    stripPrefix: false
    externalDns: false
