# AIO dev values for scalesafe-admin (Azure AKS 'creative', namespace dev). Copy to apps/scalesafe-admin/values-dev.yaml in
# satrishabh/aio-gitops. image.tag is set by CI/release to the scanned digest. Preview only (nip.io).
nameOverride: scalesafe-admin
replicaCount: 1 # AIO scales to 1 when it deploys the first scanned image
image:
  repository: ghcr.io/satrishabh/scalesafe-admin
  tag: "69148e5c0904"
imagePullSecrets:
  - name: ghcr-pull
containerPort: 8080
env:
  - name: SCALESAFE_OIDC_CLIENT_ID
    value: "scalesafe-admin"
  - name: SCALESAFE_API_ORCHESTRATOR
    value: "https://scalesafe-api-dev.52.140.55.184.nip.io/orchestrator"
  - name: SCALESAFE_API_CLIENTS
    value: "https://scalesafe-api-dev.52.140.55.184.nip.io/clients"
  - name: SCALESAFE_API_KYC
    value: "https://scalesafe-api-dev.52.140.55.184.nip.io/kyc"
  - name: SCALESAFE_API_INVESTORS
    value: "https://scalesafe-api-dev.52.140.55.184.nip.io/investors"
  - name: SCALESAFE_API_VERIFICATION
    value: "https://scalesafe-api-dev.52.140.55.184.nip.io/verification"
  - name: SCALESAFE_API_ESIGN
    value: "https://scalesafe-api-dev.52.140.55.184.nip.io/esign"
  - name: SCALESAFE_OIDC_AUTHORITY
    value: "https://scalesafe-id-dev.52.140.55.184.nip.io/realms/scalesafe" # open decision: see docs/ARCHITECTURE.md section 9
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  fsGroup: 101
resources:
  requests: {cpu: 10m, memory: 16Mi}
  limits: {cpu: 100m, memory: 64Mi}
probes:
  liveness:
    path: /health
    initialDelaySeconds: 5
  readiness:
    path: /health
    initialDelaySeconds: 2
ingress:
  enabled: true
  className: aio-azure
  controller: traefik
  host: scalesafe-admin-dev.52.140.55.184.nip.io
  tls: true
  issuer: letsencrypt-azure
  forceHttps: true
  externalDns: false
routes: []
