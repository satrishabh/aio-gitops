# AIO dev values for scalesafe-app (Azure AKS 'creative', namespace dev). Copy to apps/scalesafe-app/values-dev.yaml in
# satrishabh/aio-gitops. image.tag is set by CI/release to the scanned digest. Pre-corporate staging on indiescale.in.
nameOverride: scalesafe-app
replicaCount: 1 # AIO scales to 1 when it deploys the first scanned image
image:
  repository: ghcr.io/satrishabh/scalesafe-app
  tag: "3b0212ce5b02"
imagePullSecrets:
  - name: ghcr-pull
containerPort: 8080
env:
  - name: SCALESAFE_OIDC_CLIENT_ID
    value: "scalesafe-app"
  - name: SCALESAFE_API_ORCHESTRATOR
    value: "https://api.indiescale.in/orchestrator"
  - name: SCALESAFE_API_CLIENTS
    value: "https://api.indiescale.in/clients"
  - name: SCALESAFE_API_KYC
    value: "https://api.indiescale.in/kyc"
  - name: SCALESAFE_API_INVESTORS
    value: "https://api.indiescale.in/investors"
  - name: SCALESAFE_API_VERIFICATION
    value: "https://api.indiescale.in/verification"
  - name: SCALESAFE_API_ESIGN
    value: "https://api.indiescale.in/esign"
  - name: SCALESAFE_OIDC_AUTHORITY
    value: "https://id.indiescale.in/realms/scalesafe" # open decision: see docs/ARCHITECTURE.md section 9
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  fsGroup: 101
resources:
  requests: {cpu: 10m, memory: 16Mi}
  limits: {cpu: 100m, memory: 64Mi}
probes:
  liveness:
    path: /health
    initialDelaySeconds: 5
  readiness:
    path: /health
    initialDelaySeconds: 2
ingress:
  enabled: true
  className: aio-azure
  controller: traefik
  host: app.indiescale.in
  tls: true
  issuer: letsencrypt-azure
  forceHttps: true
  externalDns: false
routes: []
