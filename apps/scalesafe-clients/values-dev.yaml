# Managed by AIO platform - image.tag is updated by CI / promotions
# AIO dev values for scalesafe-clients (Azure AKS 'creative', namespace dev). Since the partner-model rename
# (docs/PARTNER-MODEL.md) this is client-service, the old investor-service; the old client-service is scalesafe-partners. Copy to apps/scalesafe-clients/values-dev.yaml in
# satrishabh/aio-gitops. image.tag is set by CI/release to the scanned digest. Pre-corporate staging on scalesafe.capital.
nameOverride: scalesafe-clients
replicaCount: 1
image:
  repository: ghcr.io/satrishabh/scalesafe-clients
  tag: "21e3631fefca"
imagePullSecrets:
  - name: ghcr-pull
containerPort: 8080
envFrom:
  - secretRef:
      name: scalesafe-clients-runtime # DB credentials + Keycloak client secret; created in-cluster, never in git
  # Personal-data keys of THIS service (docs/DATA-PROTECTION.md §4); created in-cluster by
  # deploy/infra/create_pii_secrets.py, never in git, never shared with another service.
  - secretRef:
      name: scalesafe-clients-pii-v2
env:
  - name: SCALESAFE_PII_KEK_PROVIDER # dev: KEK from the Secret above; production: azure-key-vault
    value: "local"
  - name: JAVA_TOOL_OPTIONS
    value: "-XX:MaxRAMPercentage=60 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k"
  - name: SCALESAFE_SAGA_ORCHESTRATOR_URL
    value: "http://scalesafe-orchestrator"
  - name: SCALESAFE_SAGA_SERVICE_NAME
    value: "client-service"
  - name: SCALESAFE_SAGA_BASE_URL
    value: "http://scalesafe-clients"
  - name: SCALESAFE_CORS_ALLOWED_ORIGINS
    # scalesafe.capital: the corporate site's newsletter form still posts to /clients/api/v1/public/** until it is
    # updated; client-service answers it with a 308 to partner-service (docs/PARTNER-MODEL.md §6).
    value: "https://app.scalesafe.capital,https://admin.scalesafe.capital,https://scalesafe.capital"
  - name: SCALESAFE_CLIENT_PUBLIC_APP_URL
    value: "https://app.scalesafe.capital"
  - name: SCALESAFE_CLIENT_VERIFICATION_URL
    value: "http://scalesafe-verification"
  # Workflow v2 (scalesafe-platform docs/NUVAMA-WORKFLOW.md): eSign health tile, operator name, admin console for
  # operator review links; sandbox keeps the consent-link inbox for e2e (platform-admin only), as esign/verification.
  - name: SCALESAFE_ESIGN_SERVICE_URL
    value: "http://scalesafe-esign"
  - name: SCALESAFE_CLIENT_OPERATOR_NAME
    value: "ScaleSafe"
  - name: SCALESAFE_CLIENT_ADMIN_APP_URL
    value: "https://admin.scalesafe.capital"
  - name: SCALESAFE_PROVIDERS_MODE
    value: "sandbox"
  # partner-service: confirms a partner application is ACTIVE before ScaleSafe approves a partner workspace.
  - name: SCALESAFE_PARTNER_SERVICE_URL
    value: "http://scalesafe-partners"
  # Old /clients/api/v1/public/** links (corporate site, confirmation e-mails) are redirected here.
  - name: SCALESAFE_PARTNER_SERVICE_PUBLIC_URL
    value: "https://api.scalesafe.capital/partners"
resources:
  requests: {cpu: 25m, memory: 256Mi}
  limits: {cpu: 500m, memory: 512Mi}
probes:
  liveness:
    path: /health/liveness
    initialDelaySeconds: 180
  readiness:
    path: /health/readiness
    initialDelaySeconds: 20
ingress:
  className: aio-azure
  controller: traefik
  enabled: false
routes:
  - host: api.scalesafe.capital
    path: "/clients"
    tls: true
    issuer: letsencrypt-azure
    certOwner: false # the orchestrator's route owns the api host certificate
    forceHttps: true
    wwwRedirect: false
    stripPrefix: true
    externalDns: false
spot:
  enabled: true
  provider: aks # tolerate the AKS spot pool; pods may land there when the regular node is full
# Run on the spot pool, not just tolerate it: the regular nodes reached 95% memory in use while their requests
# still looked roomy, so no pod went Pending and the autoscaler never added a spot node (2026-11-26).
# Postgres and Keycloak stay on regular nodes. If Azure reclaims spot capacity, this pod waits Pending.
nodeSelector:
  kubernetes.azure.com/scalesetpriority: spot
# Keep out of the kube-green connector's 20:00 sleep: ScaleSafe dev has its own night schedule (scalesafe-night-down/up,
# 23:00-08:00 every day, Postgres and Keycloak included). Label on the Deployment only, so no restart.
labels:
  kube-green.dev/exclude: "true"
