# AIO dev values for scalesafe-clients (Azure AKS 'creative', namespace dev). Copy to apps/scalesafe-clients/values-dev.yaml in
# satrishabh/aio-gitops. image.tag is set by CI/release to the scanned digest. Pre-corporate staging on scalesafe.capital.
nameOverride: scalesafe-clients
replicaCount: 1 # AIO scales to 1 when it deploys the first scanned image
image:
  repository: ghcr.io/satrishabh/scalesafe-clients
  tag: "e0677f6ff81d"
imagePullSecrets:
  - name: ghcr-pull
containerPort: 8080
envFrom:
  - secretRef:
      name: scalesafe-clients-runtime # DB credentials + Keycloak client secret; created in-cluster, never in git
  # Personal-data keys (scalesafe-platform docs/DATA-PROTECTION.md); created in-cluster, never in git.
  - secretRef:
      name: scalesafe-clients-pii
env:
  - name: SCALESAFE_PII_KEK_PROVIDER
    value: "local"   # dev: KEK from scalesafe-clients-pii; production: azure-key-vault
  - name: JAVA_TOOL_OPTIONS
    value: "-XX:MaxRAMPercentage=60 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k"
  - name: SCALESAFE_CORS_ALLOWED_ORIGINS
    value: "https://app.scalesafe.capital,https://admin.scalesafe.capital,https://scalesafe.capital"
  - name: SCALESAFE_SAGA_ORCHESTRATOR_URL
    value: "http://scalesafe-orchestrator"
  - name: SCALESAFE_SAGA_SERVICE_NAME
    value: "client-service"
  - name: SCALESAFE_SAGA_BASE_URL
    value: "http://scalesafe-clients"
  - name: SCALESAFE_CONTACT_BASE_URL
    value: "http://scalesafe-contact"   # submit needs the mobile verified (deploy scalesafe-contact first)
resources:
  requests: {cpu: 25m, memory: 256Mi}
  limits: {cpu: 500m, memory: 512Mi}
probes:
  liveness:
    path: /health/liveness
    initialDelaySeconds: 180
  readiness:
    path: /health/readiness
    initialDelaySeconds: 20
ingress:
  className: aio-azure
  controller: traefik
  enabled: false
routes:
  - host: api.scalesafe.capital
    path: "/clients"
    tls: true
    issuer: letsencrypt-azure
    certOwner: false # one route per host owns the certificate
    forceHttps: true
    wwwRedirect: false
    stripPrefix: true
    externalDns: false
