# ScaleSafe dev/preview PostgreSQL 17, in-cluster (dev only: no managed backups or HA).
# Database `scalesafe` with one schema + role per service, and database `keycloak`.
# Passwords live only in the `scalesafe-postgres` Secret (created in-cluster, never in git).
apiVersion: v1
kind: ConfigMap
metadata:
  name: scalesafe-postgres-init
  labels: { app.kubernetes.io/name: scalesafe-postgres, app.kubernetes.io/part-of: scalesafe }
data:
  10-scalesafe.sh: |
    #!/bin/sh
    # Runs once, on first start with an empty data directory.
    # Passwords come from the scalesafe-postgres Secret (PW_<ROLE> variables).
    set -eu
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<SQL
    CREATE ROLE orchestrator LOGIN PASSWORD '${PW_ORCHESTRATOR}';
    CREATE SCHEMA orchestrator AUTHORIZATION orchestrator;
    ALTER ROLE orchestrator SET search_path = orchestrator;
    CREATE ROLE partners LOGIN PASSWORD '${PW_PARTNERS}';
    CREATE SCHEMA partners AUTHORIZATION partners;
    ALTER ROLE partners SET search_path = partners;
    CREATE ROLE kyc LOGIN PASSWORD '${PW_KYC}';
    CREATE SCHEMA kyc AUTHORIZATION kyc;
    ALTER ROLE kyc SET search_path = kyc;
    CREATE ROLE clients LOGIN PASSWORD '${PW_CLIENTS}';
    CREATE SCHEMA clients AUTHORIZATION clients;
    ALTER ROLE clients SET search_path = clients;
    CREATE ROLE verification LOGIN PASSWORD '${PW_VERIFICATION}';
    CREATE SCHEMA verification AUTHORIZATION verification;
    ALTER ROLE verification SET search_path = verification;
    CREATE ROLE esign LOGIN PASSWORD '${PW_ESIGN}';
    CREATE SCHEMA esign AUTHORIZATION esign;
    ALTER ROLE esign SET search_path = esign;
    REVOKE ALL ON SCHEMA public FROM PUBLIC;
    CREATE ROLE keycloak LOGIN PASSWORD '${PW_KEYCLOAK}';
    CREATE DATABASE keycloak OWNER keycloak;
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: scalesafe-postgres
  labels: { app.kubernetes.io/name: scalesafe-postgres, app.kubernetes.io/part-of: scalesafe }
spec:
  selector: { app.kubernetes.io/name: scalesafe-postgres }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: scalesafe-postgres
  labels: { app.kubernetes.io/name: scalesafe-postgres, app.kubernetes.io/part-of: scalesafe }
spec:
  serviceName: scalesafe-postgres
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: scalesafe-postgres } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: scalesafe-postgres, app.kubernetes.io/part-of: scalesafe }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: postgres
          # Pinned (was the floating 17-alpine). Runs as uid 70, so the entrypoint never uses gosu (its Go stdlib
          # CVEs are not reachable here); read-only root with /tmp and the socket directory as emptyDirs.
          image: postgres:17.12-alpine
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: scalesafe }
            - { name: POSTGRES_USER, value: postgres }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          envFrom: [{ secretRef: { name: scalesafe-postgres } }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources:
            requests: { cpu: 25m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe: { exec: { command: [pg_isready, -U, postgres, -d, scalesafe] }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { exec: { command: [pg_isready, -U, postgres] }, initialDelaySeconds: 30, periodSeconds: 20 }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: init, configMap: { name: scalesafe-postgres-init } }
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], storageClassName: managed-csi, resources: { requests: { storage: 8Gi } } }
