# Preview realm for the ScaleSafe Keycloak: no human test users, no password-grant client.
# Service client secrets are ${SCALESAFE_CS_*} placeholders filled from the `scalesafe-keycloak` Secret at import.
apiVersion: v1
kind: ConfigMap
metadata:
  name: scalesafe-keycloak-realm
  labels: { app.kubernetes.io/name: scalesafe-keycloak, app.kubernetes.io/part-of: scalesafe }
data:
  scalesafe-realm.json: |
    {
      "realm": "scalesafe",
      "displayName": "ScaleSafe",
      "loginTheme": "scalesafe",
      "internationalizationEnabled": true,
      "supportedLocales": [
        "en"
      ],
      "defaultLocale": "en",
      "enabled": true,
      "sslRequired": "external",
      "registrationAllowed": true,
      "registrationEmailAsUsername": true,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": true,
      "accessTokenLifespan": 300,
      "ssoSessionIdleTimeout": 5400,
      "ssoSessionMaxLifespan": 36000,
      "emailTheme": "scalesafe",
      "eventsEnabled": true,
      "eventsExpiration": 2592000,
      "passwordPolicy": "length(6) and maxLength(6) and digits(6) and notUsername and passwordHistory(3)",
      "bruteForceProtected": true,
      "bruteForceStrategy": "MULTIPLE",
      "failureFactor": 5,
      "permanentLockout": true,
      "maxTemporaryLockouts": 3,
      "waitIncrementSeconds": 900,
      "maxFailureWaitSeconds": 900,
      "minimumQuickLoginWaitSeconds": 60,
      "quickLoginCheckMilliSeconds": 1000,
      "maxDeltaTimeSeconds": 43200,
      "browserFlow": "scalesafe browser",
      "resetCredentialsFlow": "scalesafe reset credentials",
      "authenticatorConfig": [
        {
          "alias": "scalesafe otp sign-in",
          "config": {
            "channel": "SMS_WITH_EMAIL_FALLBACK",
            "mode": "sandbox",
            "portalName": "ScaleSafe"
          }
        },
        {
          "alias": "scalesafe otp forgot pin",
          "config": {
            "channel": "SMS_WITH_EMAIL_FALLBACK",
            "mode": "sandbox",
            "portalName": "ScaleSafe"
          }
        }
      ],
      "authenticationFlows": [
        {
          "alias": "scalesafe browser",
          "description": "Sign-in: session cookie, else mobile number / User ID -> OTP -> PIN (docs/NUVAMA-WORKFLOW.md §8a)",
          "providerId": "basic-flow",
          "topLevel": true,
          "builtIn": false,
          "authenticationExecutions": [
            {
              "authenticator": "auth-cookie",
              "authenticatorFlow": false,
              "requirement": "ALTERNATIVE",
              "priority": 10,
              "userSetupAllowed": false
            },
            {
              "authenticatorFlow": true,
              "requirement": "ALTERNATIVE",
              "priority": 20,
              "flowAlias": "scalesafe browser forms",
              "userSetupAllowed": false
            }
          ]
        },
        {
          "alias": "scalesafe browser forms",
          "description": "Identify, OTP, PIN",
          "providerId": "basic-flow",
          "topLevel": false,
          "builtIn": false,
          "authenticationExecutions": [
            {
              "authenticator": "scalesafe-identify",
              "authenticatorFlow": false,
              "requirement": "REQUIRED",
              "priority": 10,
              "userSetupAllowed": false
            },
            {
              "authenticator": "scalesafe-otp",
              "authenticatorFlow": false,
              "requirement": "REQUIRED",
              "priority": 20,
              "userSetupAllowed": false,
              "authenticatorConfig": "scalesafe otp sign-in"
            },
            {
              "authenticator": "scalesafe-pin",
              "authenticatorFlow": false,
              "requirement": "REQUIRED",
              "priority": 30,
              "userSetupAllowed": false
            }
          ]
        },
        {
          "alias": "scalesafe reset credentials",
          "description": "Forgot PIN: mobile number / User ID -> OTP -> set a new PIN (no e-mail link)",
          "providerId": "basic-flow",
          "topLevel": true,
          "builtIn": false,
          "authenticationExecutions": [
            {
              "authenticator": "scalesafe-identify",
              "authenticatorFlow": false,
              "requirement": "REQUIRED",
              "priority": 10,
              "userSetupAllowed": false
            },
            {
              "authenticator": "scalesafe-otp",
              "authenticatorFlow": false,
              "requirement": "REQUIRED",
              "priority": 20,
              "userSetupAllowed": false,
              "authenticatorConfig": "scalesafe otp forgot pin"
            },
            {
              "authenticator": "reset-password",
              "authenticatorFlow": false,
              "requirement": "REQUIRED",
              "priority": 30,
              "userSetupAllowed": false
            }
          ]
        }
      ],
      "components": {
        "org.keycloak.userprofile.UserProfileProvider": [
          {
            "providerId": "declarative-user-profile",
            "subComponents": {},
            "config": {
              "kc.user.profile.config": [
                "{\"attributes\":[{\"name\":\"username\",\"displayName\":\"${username}\",\"validations\":{\"length\":{\"min\":3,\"max\":255},\"username-prohibited-characters\":{},\"up-username-not-idn-homograph\":{}},\"permissions\":{\"view\":[\"admin\",\"user\"],\"edit\":[\"admin\",\"user\"]},\"multivalued\":false},{\"name\":\"email\",\"displayName\":\"${email}\",\"validations\":{\"email\":{},\"length\":{\"max\":255}},\"required\":{\"roles\":[\"user\"]},\"permissions\":{\"view\":[\"admin\",\"user\"],\"edit\":[\"admin\",\"user\"]},\"multivalued\":false},{\"name\":\"firstName\",\"displayName\":\"${firstName}\",\"validations\":{\"length\":{\"max\":255},\"person-name-prohibited-characters\":{}},\"required\":{\"roles\":[\"user\"]},\"permissions\":{\"view\":[\"admin\",\"user\"],\"edit\":[\"admin\",\"user\"]},\"multivalued\":false},{\"name\":\"lastName\",\"displayName\":\"${lastName}\",\"validations\":{\"length\":{\"max\":255},\"person-name-prohibited-characters\":{}},\"required\":{\"roles\":[\"user\"]},\"permissions\":{\"view\":[\"admin\",\"user\"],\"edit\":[\"admin\",\"user\"]},\"multivalued\":false},{\"name\":\"mobile\",\"displayName\":\"Registered mobile number\",\"validations\":{\"pattern\":{\"pattern\":\"^\\\\+91[0-9]{10}$\",\"error-message\":\"Use +91 followed by 10 digits\"}},\"permissions\":{\"view\":[\"admin\",\"user\"],\"edit\":[\"admin\"]},\"multivalued\":false}],\"groups\":[{\"name\":\"user-metadata\",\"displayHeader\":\"User metadata\",\"displayDescription\":\"Attributes, which refer to user metadata\"}]}"
              ]
            }
          }
        ]
      },
      "roles": {
        "realm": [
          {
            "name": "partner",
            "description": "Partner portal user: own partner application and KYC only (self-registration default)"
          },
          {
            "name": "ops",
            "description": "ScaleSafe operations: admin console, KYC review"
          },
          {
            "name": "platform-admin",
            "description": "Saga definitions, registry, retry and cancel"
          },
          {
            "name": "saga-participant",
            "description": "Service calling orchestrator registry, start and callbacks"
          },
          {
            "name": "saga-orchestrator",
            "description": "Orchestrator calling participant saga actions"
          },
          {
            "name": "partner-maker",
            "description": "Partner staff: create and prepare client cases"
          },
          {
            "name": "partner-checker",
            "description": "Partner staff: approve or return client cases (not their own)"
          },
          {
            "name": "partner-manager",
            "description": "Partner manager: dashboard, rules overrides"
          },
          {
            "name": "operator-maker",
            "description": "Platform operator (Nuvama Maker): first operator review of submitted client cases, any tenant"
          },
          {
            "name": "operator-checker",
            "description": "Platform operator (Nuvama Checker): final operator approval of client cases (not their own), any tenant"
          },
          {
            "name": "default-roles-scalesafe",
            "description": "Granted to every new user",
            "composite": true,
            "composites": {
              "realm": [
                "partner"
              ]
            }
          }
        ]
      },
      "defaultRole": {
        "name": "default-roles-scalesafe"
      },
      "clients": [
        {
          "clientId": "scalesafe-app",
          "name": "ScaleSafe partner portal",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "redirectUris": [
            "https://app.scalesafe.capital/*"
          ],
          "webOrigins": [
            "https://app.scalesafe.capital"
          ],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "https://app.scalesafe.capital/*"
          },
          "protocolMappers": [
            {
              "name": "tenant groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "consentRequired": false,
              "config": {
                "full.path": "true",
                "claim.name": "groups",
                "access.token.claim": "true",
                "id.token.claim": "true",
                "userinfo.token.claim": "true",
                "introspection.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "scalesafe-admin",
          "name": "ScaleSafe admin console",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "redirectUris": [
            "https://admin.scalesafe.capital/*"
          ],
          "webOrigins": [
            "https://admin.scalesafe.capital"
          ],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "https://admin.scalesafe.capital/*"
          },
          "protocolMappers": [
            {
              "name": "tenant groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "consentRequired": false,
              "config": {
                "full.path": "true",
                "claim.name": "groups",
                "access.token.claim": "true",
                "id.token.claim": "true",
                "userinfo.token.claim": "true",
                "introspection.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "orchestrator",
          "enabled": true,
          "publicClient": false,
          "secret": "${SCALESAFE_CS_ORCHESTRATOR}",
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": true
        },
        {
          "clientId": "partner-service",
          "enabled": true,
          "publicClient": false,
          "secret": "${SCALESAFE_CS_PARTNER_SERVICE}",
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": true
        },
        {
          "clientId": "kyc-service",
          "enabled": true,
          "publicClient": false,
          "secret": "${SCALESAFE_CS_KYC_SERVICE}",
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": true
        },
        {
          "clientId": "client-service",
          "enabled": true,
          "publicClient": false,
          "secret": "${SCALESAFE_CS_CLIENT_SERVICE}",
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": true
        },
        {
          "clientId": "verification-service",
          "enabled": true,
          "publicClient": false,
          "secret": "${SCALESAFE_CS_VERIFICATION_SERVICE}",
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": true
        },
        {
          "clientId": "esign-service",
          "enabled": true,
          "publicClient": false,
          "secret": "${SCALESAFE_CS_ESIGN_SERVICE}",
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": true
        }
      ],
      "users": [
        {
          "username": "service-account-orchestrator",
          "enabled": true,
          "serviceAccountClientId": "orchestrator",
          "realmRoles": [
            "saga-orchestrator"
          ]
        },
        {
          "username": "service-account-partner-service",
          "enabled": true,
          "serviceAccountClientId": "partner-service",
          "realmRoles": [
            "saga-participant"
          ]
        },
        {
          "username": "service-account-kyc-service",
          "enabled": true,
          "serviceAccountClientId": "kyc-service",
          "realmRoles": [
            "saga-participant"
          ]
        },
        {
          "username": "service-account-client-service",
          "enabled": true,
          "serviceAccountClientId": "client-service",
          "realmRoles": [
            "saga-participant"
          ]
        },
        {
          "username": "service-account-verification-service",
          "enabled": true,
          "serviceAccountClientId": "verification-service",
          "realmRoles": [
            "saga-participant"
          ]
        },
        {
          "username": "service-account-esign-service",
          "enabled": true,
          "serviceAccountClientId": "esign-service",
          "realmRoles": [
            "saga-participant"
          ]
        }
      ],
      "groups": [
        {
          "name": "tenants",
          "path": "/tenants",
          "subGroups": [
            {
              "name": "acme-capital",
              "path": "/tenants/acme-capital"
            },
            {
              "name": "beta-advisors",
              "path": "/tenants/beta-advisors"
            }
          ]
        }
      ]
    }
