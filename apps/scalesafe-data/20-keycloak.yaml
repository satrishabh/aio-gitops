# ScaleSafe Keycloak 26 (separate from Sarvaikam's production identity), backed by scalesafe-postgres.
apiVersion: v1
kind: Service
metadata:
  name: scalesafe-keycloak
  labels: { app.kubernetes.io/name: scalesafe-keycloak, app.kubernetes.io/part-of: scalesafe }
spec:
  selector: { app.kubernetes.io/name: scalesafe-keycloak }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scalesafe-keycloak
  labels: { app.kubernetes.io/name: scalesafe-keycloak, app.kubernetes.io/part-of: scalesafe }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: scalesafe-keycloak } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: scalesafe-keycloak, app.kubernetes.io/part-of: scalesafe }
      # Change with the theme files and the extension JAR, so Argo CD rolls Keycloak and it serves the new ones.
      annotations: { scalesafe.io/theme-checksum: "74291564a444bd06", scalesafe.io/providers-checksum: "da9474b39d2d2472" }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.2
          args: [start, --import-realm]
          ports: [{ name: http, containerPort: 8080 }, { name: management, containerPort: 9000 }]
          env:
            - { name: KC_DB, value: postgres }
            - { name: KC_DB_URL, value: "jdbc:postgresql://scalesafe-postgres:5432/keycloak" }
            - { name: KC_DB_USERNAME, value: keycloak }
            - { name: KC_HOSTNAME, value: "https://id.scalesafe.capital" }
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_PROXY_HEADERS, value: xforwarded }
            - { name: KC_HEALTH_ENABLED, value: "true" }
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            - { name: JAVA_OPTS_KC_HEAP, value: "-XX:MaxRAMPercentage=65" }
            # dev/preview only: the sign-in OTP may run in sandbox mode (123456, nothing sent). Never on production.
            - { name: SCALESAFE_AUTH_SANDBOX_ALLOWED, value: "true" }
          # Optional Secret scalesafe-sms: KC_SPI_SCALESAFE_SMS_SENDER_HTTP_GATEWAY_URL, _API_KEY, _SENDER_ID,
          # _TEMPLATE_ID, _ENTITY_ID (DLT). Without it the SMS channel stays inactive.
          envFrom: [{ secretRef: { name: scalesafe-keycloak } }, { secretRef: { name: scalesafe-sms, optional: true } }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          resources:
            requests: { cpu: 25m, memory: 384Mi }
            limits: { cpu: "1", memory: 1Gi }
          startupProbe: { httpGet: { path: /health/started, port: management }, periodSeconds: 10, failureThreshold: 36 }
          readinessProbe: { httpGet: { path: /health/ready, port: management }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: management }, periodSeconds: 20 }
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import, readOnly: true }
            - { name: theme, mountPath: /opt/keycloak/themes/scalesafe, readOnly: true }
            - { name: providers, mountPath: /opt/keycloak/providers, readOnly: true }
      volumes:
        - { name: realm, configMap: { name: scalesafe-keycloak-realm } }
        - name: providers
          configMap:
            name: scalesafe-keycloak-providers
            items:
              - { key: scalesafe-auth.jar, path: scalesafe-auth.jar }
        - name: theme
          configMap:
            name: scalesafe-keycloak-theme
            items:
              - { key: email__html__scalesafe-otp.ftl, path: email/html/scalesafe-otp.ftl }
              - { key: email__messages__messages_en.properties, path: email/messages/messages_en.properties }
              - { key: email__text__scalesafe-otp.ftl, path: email/text/scalesafe-otp.ftl }
              - { key: email__theme.properties, path: email/theme.properties }
              - { key: login__login-update-password.ftl, path: login/login-update-password.ftl }
              - { key: login__messages__messages_en.properties, path: login/messages/messages_en.properties }
              - { key: login__resources__css__scalesafe.css, path: login/resources/css/scalesafe.css }
              - { key: login__resources__fonts__inter-latin-var.woff2, path: login/resources/fonts/inter-latin-var.woff2 }
              - { key: login__resources__fonts__source-serif-4-latin-var.woff2, path: login/resources/fonts/source-serif-4-latin-var.woff2 }
              - { key: login__resources__img__logo.svg, path: login/resources/img/logo.svg }
              - { key: login__resources__js__scalesafe-codes.js, path: login/resources/js/scalesafe-codes.js }
              - { key: login__scalesafe-identify.ftl, path: login/scalesafe-identify.ftl }
              - { key: login__scalesafe-otp.ftl, path: login/scalesafe-otp.ftl }
              - { key: login__scalesafe-pin.ftl, path: login/scalesafe-pin.ftl }
              - { key: login__theme.properties, path: login/theme.properties }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scalesafe-keycloak
  labels: { app.kubernetes.io/name: scalesafe-keycloak, app.kubernetes.io/part-of: scalesafe }
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-azure
spec:
  ingressClassName: aio-azure
  tls: [{ hosts: ["id.scalesafe.capital"], secretName: tls-scalesafe-id-dev }]
  rules:
    - host: "id.scalesafe.capital"
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: scalesafe-keycloak, port: { name: http } } } }]
