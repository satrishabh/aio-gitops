# ScaleSafe dev/preview night shutdown: scale everything ScaleSafe runs in `dev` to 0 at 23:00 IST and back
# to 1 at 08:00 IST, so the shared AKS node has room for other work. The data stays: Postgres keeps its volume.
# The corporate site preview (scalesafe-site) is included.
#
# Order matters on the way up: Postgres, then Keycloak, then the services and web apps.
# If an AIO app in Argo CD has auto-sync with self-heal, it would scale the app straight back up. The job then
# pauses auto-sync at night and restores it in the morning (same as the toggle on AIO's CD page). That needs
# get/patch on those Applications in namespace argocd. The Argo project only allows resources in dev, so that
# permission is in argocd-night-scaler-rbac.yaml, applied once by hand.
#
# Run by hand:  kubectl -n dev create job --from=cronjob/scalesafe-night-down scalesafe-down-now   (or -up)
# Pause:        kubectl -n dev patch cronjob scalesafe-night-down -p '{"spec":{"suspend":true}}'
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scalesafe-night-scaler
  namespace: dev
  labels: { app.kubernetes.io/part-of: scalesafe }
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scalesafe-night-scaler
  namespace: dev
  labels: { app.kubernetes.io/part-of: scalesafe }
rules:
  - apiGroups: [apps]
    resources: [deployments, deployments/scale]
    verbs: [get, patch]
    resourceNames: [scalesafe-keycloak, scalesafe-orchestrator, scalesafe-partners, scalesafe-kyc, scalesafe-clients,
                    scalesafe-verification, scalesafe-esign, scalesafe-app, scalesafe-admin, scalesafe-site]
  - apiGroups: [apps]
    resources: [statefulsets, statefulsets/scale]
    verbs: [get, patch]
    resourceNames: [scalesafe-postgres]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scalesafe-night-scaler
  namespace: dev
  labels: { app.kubernetes.io/part-of: scalesafe }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: scalesafe-night-scaler }
subjects:
  - { kind: ServiceAccount, name: scalesafe-night-scaler, namespace: dev }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: scalesafe-night-scaler
  namespace: dev
  labels: { app.kubernetes.io/part-of: scalesafe }
data:
  night.py: |
    """Scale the ScaleSafe dev stack down (night) or up (morning) through the Kubernetes API."""
    import json, ssl, sys, time, urllib.error, urllib.request

    API = "https://kubernetes.default.svc"
    SA = "/var/run/secrets/kubernetes.io/serviceaccount"
    NS = "dev"
    SAVED = "scalesafe.co.in/night-saved-autosync"
    DEFAULT_AUTOSYNC = {"prune": True, "selfHeal": True}  # what AIO sets on every new dev app
    APPS = ["scalesafe-orchestrator", "scalesafe-partners", "scalesafe-kyc", "scalesafe-clients",
            "scalesafe-verification", "scalesafe-esign", "scalesafe-app", "scalesafe-admin", "scalesafe-site"]
    TOKEN = open(SA + "/token").read().strip()
    CTX = ssl.create_default_context(cafile=SA + "/ca.crt")


    def call(method, path, body=None):
        req = urllib.request.Request(API + path, method=method,
                                     data=None if body is None else json.dumps(body).encode(),
                                     headers={"Authorization": "Bearer " + TOKEN, "Accept": "application/json",
                                              "Content-Type": "application/merge-patch+json"})
        try:
            with urllib.request.urlopen(req, context=CTX, timeout=30) as r:
                return r.status, json.load(r)
        except urllib.error.HTTPError as e:
            return e.code, None
        except OSError as e:
            print("  request failed:", e)
            return 0, None


    def argo(app):
        return f"/apis/argoproj.io/v1alpha1/namespaces/argocd/applications/{app}"


    def pause_autosync(app):
        code, a = call("GET", argo(app))
        if code != 200:
            print(f"{app}: {'no Argo app' if code == 404 else 'no permission to read Argo app' if code == 403 else code}")
            return
        auto = (a["spec"].get("syncPolicy") or {}).get("automated")
        if auto is None:
            return
        code, _ = call("PATCH", argo(app), {"metadata": {"annotations": {SAVED: json.dumps(auto)}},
                                            "spec": {"syncPolicy": {"automated": None}}})
        print(f"{app}: auto-sync paused ({code})")


    def resume_autosync(app):
        code, a = call("GET", argo(app))
        if code != 200:
            return
        saved = (a["metadata"].get("annotations") or {}).get(SAVED)
        if saved:
            code, _ = call("PATCH", argo(app), {"metadata": {"annotations": {SAVED: None}},
                                                "spec": {"syncPolicy": {"automated": json.loads(saved)}}})
            print(f"{app}: auto-sync restored ({code})")
        elif (a["spec"].get("syncPolicy") or {}).get("automated") is None:
            # The saved note can be lost when AIO rewrites the app overnight (16 Nov: the site stayed paused).
            # Every ScaleSafe dev app runs AIO's default, so restore that rather than leave it paused.
            code, _ = call("PATCH", argo(app), {"spec": {"syncPolicy": {"automated": DEFAULT_AUTOSYNC}}})
            print(f"{app}: auto-sync was off with no saved setting; AIO default restored ({code})")


    def scale(kind, name, n):
        code, _ = call("PATCH", f"/apis/apps/v1/namespaces/{NS}/{kind}/{name}/scale", {"spec": {"replicas": n}})
        print(f"{kind}/{name} -> {n}: {'ok' if code == 200 else 'not deployed' if code == 404 else code}")
        return code == 200


    def wait_ready(kind, name, timeout=420):
        end = time.time() + timeout
        while time.time() < end:
            code, o = call("GET", f"/apis/apps/v1/namespaces/{NS}/{kind}/{name}")
            if code != 200:
                return
            if (o.get("status", {}).get("readyReplicas") or 0) >= 1:
                print(f"{name}: ready")
                return
            time.sleep(10)
        print(f"{name}: not ready after {timeout}s, continuing")


    mode = sys.argv[1] if len(sys.argv) > 1 else ""
    if mode == "down":
        for app in APPS:
            pause_autosync(app + "-dev")
        for app in APPS:
            scale("deployments", app, 0)
        scale("deployments", "scalesafe-keycloak", 0)
        scale("statefulsets", "scalesafe-postgres", 0)
    elif mode == "up":
        if scale("statefulsets", "scalesafe-postgres", 1):
            wait_ready("statefulsets", "scalesafe-postgres")
        if scale("deployments", "scalesafe-keycloak", 1):
            wait_ready("deployments", "scalesafe-keycloak")
        for app in APPS:
            scale("deployments", app, 1)
        for app in APPS:
            resume_autosync(app + "-dev")
    else:
        sys.exit("usage: night.py down|up")
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scalesafe-night-down
  namespace: dev
  labels: { app.kubernetes.io/part-of: scalesafe }
spec:
  schedule: "0 23 * * *"
  timeZone: Asia/Kolkata
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1200
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: { app.kubernetes.io/part-of: scalesafe, app.kubernetes.io/name: scalesafe-night-scaler }
        spec:
          serviceAccountName: scalesafe-night-scaler
          restartPolicy: Never
          securityContext: { runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: scale
              image: python:3.13.1-alpine3.21
              command: [python, -I, -B, -u, /script/night.py, down]
              securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { cpu: 100m, memory: 64Mi }
              volumeMounts: [{ name: script, mountPath: /script, readOnly: true }]
          volumes:
            - { name: script, configMap: { name: scalesafe-night-scaler } }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scalesafe-night-up
  namespace: dev
  labels: { app.kubernetes.io/part-of: scalesafe }
spec:
  schedule: "0 8 * * *"
  timeZone: Asia/Kolkata
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1200
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: { app.kubernetes.io/part-of: scalesafe, app.kubernetes.io/name: scalesafe-night-scaler }
        spec:
          serviceAccountName: scalesafe-night-scaler
          restartPolicy: Never
          securityContext: { runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: scale
              image: python:3.13.1-alpine3.21
              command: [python, -I, -B, -u, /script/night.py, up]
              securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { cpu: 100m, memory: 64Mi }
              volumeMounts: [{ name: script, mountPath: /script, readOnly: true }]
          volumes:
            - { name: script, configMap: { name: scalesafe-night-scaler } }
