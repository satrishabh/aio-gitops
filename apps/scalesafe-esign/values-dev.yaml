# Managed by AIO platform - image.tag is updated by CI / promotions
# AIO dev values for scalesafe-esign (Azure AKS 'creative', namespace dev). Copy to apps/scalesafe-esign/values-dev.yaml in
# satrishabh/aio-gitops. image.tag is set by CI/release to the scanned digest. Pre-corporate staging on scalesafe.capital.
nameOverride: scalesafe-esign
replicaCount: 1
image:
  repository: ghcr.io/satrishabh/scalesafe-esign
  tag: "21e3631fefca"
imagePullSecrets:
  - name: ghcr-pull
containerPort: 8080
envFrom:
  - secretRef:
      name: scalesafe-esign-runtime # DB credentials + Keycloak client secret; created in-cluster, never in git
  # Personal-data keys of THIS service (docs/DATA-PROTECTION.md §4); created in-cluster by
  # deploy/infra/create_pii_secrets.py, never in git, never shared with another service.
  - secretRef:
      name: scalesafe-esign-pii
env:
  - name: SCALESAFE_PII_KEK_PROVIDER # dev: KEK from the Secret above; production: azure-key-vault
    value: "local"
  # Module entitlements per partner (docs/PARTNER-MODEL.md §3.2), read from client-service; fail closed without it.
  - name: SCALESAFE_MODULES_ENTITLEMENTS_URL
    value: "http://scalesafe-clients"
  - name: JAVA_TOOL_OPTIONS
    value: "-XX:MaxRAMPercentage=60 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k"
  - name: SCALESAFE_SAGA_ORCHESTRATOR_URL
    value: "http://scalesafe-orchestrator"
  - name: SCALESAFE_SAGA_SERVICE_NAME
    value: "esign-service"
  - name: SCALESAFE_SAGA_BASE_URL
    value: "http://scalesafe-esign"
  - name: SCALESAFE_CORS_ALLOWED_ORIGINS
    value: "https://app.scalesafe.capital,https://admin.scalesafe.capital"
  - name: SCALESAFE_PROVIDERS_MODE
    value: "sandbox"
  - name: SCALESAFE_ESIGN_PUBLIC_APP_URL
    value: "https://app.scalesafe.capital"
resources:
  requests: {cpu: 25m, memory: 256Mi}
  limits: {cpu: 500m, memory: 512Mi}
probes:
  liveness:
    path: /health/liveness
    initialDelaySeconds: 180
  readiness:
    path: /health/readiness
    initialDelaySeconds: 20
ingress:
  className: aio-azure
  controller: traefik
  enabled: false
routes:
  - host: api.scalesafe.capital
    path: "/esign"
    tls: true
    issuer: letsencrypt-azure
    certOwner: false # the orchestrator's route owns the api host certificate
    forceHttps: true
    wwwRedirect: false
    stripPrefix: true
    externalDns: false
spot:
  enabled: true
  provider: aks # tolerate the AKS spot pool; pods may land there when the regular node is full
# Run on the spot pool, not just tolerate it: the regular nodes reached 95% memory in use while their requests
# still looked roomy, so no pod went Pending and the autoscaler never added a spot node (2026-11-26).
# Postgres and Keycloak stay on regular nodes. If Azure reclaims spot capacity, this pod waits Pending.
nodeSelector:
  kubernetes.azure.com/scalesetpriority: spot
