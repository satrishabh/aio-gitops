# AIO dev values for scalesafe-kyc (Azure AKS 'creative', namespace dev). Copy to apps/scalesafe-kyc/values-dev.yaml in
# satrishabh/aio-gitops. image.tag is set by CI/release to the scanned digest. Preview only (nip.io).
nameOverride: scalesafe-kyc
replicaCount: 0   # AIO scales to 1 when it deploys the first scanned image
image:
  repository: ghcr.io/satrishabh/scalesafe-kyc
  tag: "0.0.0"
imagePullSecrets:
  - name: ghcr-pull
containerPort: 8080
envFrom:
  - secretRef:
      name: scalesafe-kyc-runtime   # DB credentials + Keycloak client secret; created in-cluster, never in git
env:
  - name: JAVA_TOOL_OPTIONS
    value: "-XX:MaxRAMPercentage=60 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k"
  - name: SCALESAFE_CORS_ALLOWED_ORIGINS
    value: "https://scalesafe-app-dev.52.140.55.184.nip.io,https://scalesafe-admin-dev.52.140.55.184.nip.io,https://scalesafe-site-dev.52.140.55.184.nip.io"
  - name: SCALESAFE_SAGA_ORCHESTRATOR_URL
    value: "http://scalesafe-orchestrator"
  - name: SCALESAFE_SAGA_SERVICE_NAME
    value: "kyc-service"
  - name: SCALESAFE_SAGA_BASE_URL
    value: "http://scalesafe-kyc"
resources:
  requests: { cpu: 25m, memory: 256Mi }
  limits: { cpu: 500m, memory: 512Mi }
probes:
  liveness:
    path: /health/liveness
    initialDelaySeconds: 180
  readiness:
    path: /health/readiness
    initialDelaySeconds: 20
ingress:
  className: aio-azure
  controller: traefik
  enabled: false
routes:
  - host: scalesafe-api-dev.52.140.55.184.nip.io
    path: "/kyc"
    tls: true
    issuer: letsencrypt-azure
    certOwner: false   # one route per host owns the certificate
    forceHttps: true
    wwwRedirect: false
    stripPrefix: true
    externalDns: false
