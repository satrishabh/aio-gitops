# Managed by AIO platform - image.tag is updated by CI / promotions
# AIO dev values for scalesafe-verification (Azure AKS 'creative', namespace dev). Copy to apps/scalesafe-verification/values-dev.yaml in
# satrishabh/aio-gitops. image.tag is set by CI/release to the scanned digest. Pre-corporate staging on scalesafe.capital.
nameOverride: scalesafe-verification
replicaCount: 1
image:
  repository: ghcr.io/satrishabh/scalesafe-verification
  tag: "eaf40ab5be92"
imagePullSecrets:
  - name: ghcr-pull
containerPort: 8080
envFrom:
  - secretRef:
      name: scalesafe-verification-runtime # DB credentials + Keycloak client secret; created in-cluster, never in git
env:
  # Module entitlements per partner (docs/PARTNER-MODEL.md §3.2), read from client-service; fail closed without it.
  - name: SCALESAFE_MODULES_ENTITLEMENTS_URL
    value: "http://scalesafe-clients"
  - name: JAVA_TOOL_OPTIONS
    value: "-XX:MaxRAMPercentage=60 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k"
  - name: SCALESAFE_SAGA_ORCHESTRATOR_URL
    value: "http://scalesafe-orchestrator"
  - name: SCALESAFE_SAGA_SERVICE_NAME
    value: "verification-service"
  - name: SCALESAFE_SAGA_BASE_URL
    value: "http://scalesafe-verification"
  - name: SCALESAFE_CORS_ALLOWED_ORIGINS
    value: "https://app.scalesafe.capital,https://admin.scalesafe.capital"
  - name: SCALESAFE_PROVIDERS_MODE
    value: "sandbox"
resources:
  requests: {cpu: 25m, memory: 256Mi}
  limits: {cpu: 500m, memory: 512Mi}
probes:
  liveness:
    path: /health/liveness
    initialDelaySeconds: 180
  readiness:
    path: /health/readiness
    initialDelaySeconds: 20
ingress:
  className: aio-azure
  controller: traefik
  enabled: false
routes:
  - host: api.scalesafe.capital
    path: "/verification"
    tls: true
    issuer: letsencrypt-azure
    certOwner: false # the orchestrator's route owns the api host certificate
    forceHttps: true
    wwwRedirect: false
    stripPrefix: true
    externalDns: false
