# Managed by AIO platform - image.tag is updated by CI / promotions
image:
  repository: ghcr.io/satrishabh/user-profile-manager
  tag: "b252e7a94418"
# 0 until a real image is deployed (avoids pulling the placeholder tag)
replicaCount: 1
containerPort: 8080
imagePullSecrets:
  - name: ghcr-pull
pdb:
  enabled: false
ingress:
  enabled: true
  host: user-profile-manager-dev.34.180.3.18.nip.io
env:
  - name: KC_DB
    value: "postgres"
  - name: KC_HTTP_ENABLED
    value: "true"
  - name: KC_PROXY_HEADERS
    value: "xforwarded"
  - name: VERIFY_EMAIL
    value: "true"
envFrom:
  - secretRef:
      name: profile-manager-runtime
probes:
  liveness:
    path: /health/live
    initialDelaySeconds: 60
  readiness:
    path: /health/ready
    initialDelaySeconds: 30
# Managed by AIO GitOps for the Hostinger-backed custom domain.
routes:
  - host: profile.sarvaikam.com
    path: "/"
    tls: true
    issuer: gts
    certOwner: true
    forceHttps: true
    wwwRedirect: false
    stripPrefix: false
    externalDns: false
resources:
  requests: {cpu: "250m", memory: "512Mi"}
  limits: {cpu: "1000m", memory: "1024Mi"}
