apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
spec:
  description: Application workloads deployed via GitOps
  sourceRepos:
    - https://github.com/satrishabh/aio-gitops.git
  destinations:
    # Workload clusters (registered by bootstrap/add-cluster.sh; the platform targets them by name).
    # Only the shared env namespaces are allowed, on any cluster registered in Argo CD.
    - { name: "*", namespace: dev }
    - { name: "*", namespace: staging }
    - { name: "*", namespace: prod }
    # hub (in-cluster): the single-cluster layout, and apps not yet moved to a workload cluster
    - { server: https://kubernetes.default.svc, namespace: dev }
    - { server: https://kubernetes.default.svc, namespace: staging }
    - { server: https://kubernetes.default.svc, namespace: prod }
    # legacy layouts (kept so older apps can still be synced/cleaned up)
    - { server: https://kubernetes.default.svc, namespace: app-dev }
    - { server: https://kubernetes.default.svc, namespace: app-staging }
    - { server: https://kubernetes.default.svc, namespace: app-prod }
  # namespaces are prepared per cluster (platform on the hub, add-cluster.sh on workload clusters), not by app syncs
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - { group: "*", kind: "*" }
  namespaceResourceBlacklist:
    - { group: "", kind: ResourceQuota }
    - { group: "", kind: LimitRange }
