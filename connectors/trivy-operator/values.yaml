# trivy-operator values for the "trivy-operator" connector (chart 0.38.1; rollback target 0.37.0).
# Installed by the AIO portal through Argo CD (app connector-trivy-operator, namespace trivy-system).
# Works on any conformant Kubernetes; no cloud-specific settings.

# Scan the app environments and the platform itself, not system namespaces (keeps scan jobs small on a 2-node cluster)
targetNamespaces: "dev,staging,prod,aio-platform"

operator:
  # Recurring job: a report expires after 24h, which makes the operator rescan the workload. New CVEs published
  # after the CI scan therefore show up within a day.
  scannerReportTTL: "24h"
  scanJobsConcurrentLimit: 2          # at most two scan pods at a time
  scanJobTimeout: 10m
  vulnerabilityScannerScanOnlyCurrentRevisions: true
  configAuditScannerScanOnlyCurrentRevisions: true
  exposedSecretScannerEnabled: true
  configAuditScannerEnabled: true
  rbacAssessmentScannerEnabled: true
  # Node and CIS compliance scans need privileged node-collector pods; managed clouds already cover the nodes
  infraAssessmentScannerEnabled: false
  clusterComplianceEnabled: false
  sbomGenerationEnabled: true

trivy:
  severity: HIGH,CRITICAL
  ignoreUnfixed: true                 # report only what can be fixed by an update
  resources:
    requests: { cpu: 100m, memory: 128M }
    limits: { cpu: 500m, memory: 500M }

# Metrics are served on :8080 (Service trivy-operator, headless). Turn on once Prometheus is enabled to get
# Grafana dashboards; left off so this connector works without Prometheus.
serviceMonitor:
  enabled: false

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 512Mi }
