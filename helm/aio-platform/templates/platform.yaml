{{- $name := .Release.Name | trunc 63 | trimSuffix "-" -}}
{{- $repository := required "image.repository is required" .Values.image.repository -}}
{{- $digest := required "image.digest is required" .Values.image.digest -}}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" $digest) -}}
{{- fail "image.digest must be an immutable sha256 digest" -}}
{{- end -}}
{{- $secret := required "existingSecret is required" .Values.existingSecret -}}
{{- range $key := list "APP_PUBLIC_URL" "APP_REGISTRY" "APP_REGISTRY_USER" "GITOPS_REPO_URL" "GITOPS_OWNER" "GITOPS_REPO" "OIDC_ISSUER_URI" "OIDC_CLIENT_ID" "ARGOCD_URL" "ALLOWED_ROLES" -}}
{{- $_ := required (printf "config.%s is required" $key) (index $.Values.config $key) -}}
{{- end -}}
{{- range $key := list "APP_PUBLIC_URL" "GITOPS_REPO_URL" "OIDC_ISSUER_URI" "ARGOCD_URL" -}}
{{- if not (hasPrefix "https://" (index $.Values.config $key)) -}}
{{- fail (printf "config.%s must use HTTPS" $key) -}}
{{- end -}}
{{- end -}}
{{- range $key := list "DB_URL" "DB_USER" "DB_PASSWORD" "OIDC_CLIENT_SECRET" "GITHUB_TOKEN" "ARGOCD_TOKEN" -}}
{{- if hasKey $.Values.config $key -}}
{{- fail (printf "%s belongs in existingSecret, not config" $key) -}}
{{- end -}}
{{- end -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  annotations: {{- toYaml .Values.serviceAccount.annotations | nindent 4 }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  # Observers and housekeeping currently require a single application replica.
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ $name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ $name }}}
    spec:
      serviceAccountName: {{ required "serviceAccount.name is required" .Values.serviceAccount.name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsNonRoot: true, fsGroup: 10001}
      containers:
        - name: app
          image: {{ printf "%s@%s" $repository $digest | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8080}]
          env:
            {{- range $key, $value := .Values.config }}
            - name: {{ $key }}
              value: {{ $value | toString | quote }}
            {{- end }}
            {{- range $key := list "DB_URL" "DB_USER" "DB_PASSWORD" "OIDC_CLIENT_SECRET" "GITHUB_TOKEN" "ARGOCD_TOKEN" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef: {name: {{ $secret }}, key: {{ $key }}}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 10
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector: {app.kubernetes.io/instance: {{ $name }}}
  ports: [{name: http, port: 80, targetPort: http}]
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  annotations: {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ required "ingress.className is required" .Values.ingress.className }}
  tls:
    - secretName: {{ required "ingress.tlsSecretName is required" .Values.ingress.tlsSecretName }}
      hosts: [{{ required "ingress.host is required" .Values.ingress.host | quote }}]
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: {{ $name }}, port: {name: http}}
{{- end }}
