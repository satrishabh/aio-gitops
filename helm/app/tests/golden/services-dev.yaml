---
# Source: app/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: demo
  labels:
    app.kubernetes.io/name: demo
    app.kubernetes.io/instance: demo
    app.kubernetes.io/version: "1a2b3c4d5e6f"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: app-0.1.0
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: demo
    app.kubernetes.io/instance: demo
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Source: app/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  labels:
    app.kubernetes.io/name: demo
    app.kubernetes.io/instance: demo
    app.kubernetes.io/version: "1a2b3c4d5e6f"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: app-0.1.0
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: demo
      app.kubernetes.io/instance: demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo
        app.kubernetes.io/instance: demo
      annotations:
        dapr.io/app-id: shop
        dapr.io/app-port: "8080"
        dapr.io/enabled: "true"
    spec:
      securityContext:
        fsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: app
          image: "ghcr.io/example/shop:1a2b3c4d5e6f"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LOG_LEVEL
              value: info
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: shop-cloudnative-pg-app
            - name: PGHOST
              value: shop-cloudnative-pg-rw
            - name: VALKEY_HOST
              value: valkey.valkey.svc
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: shop-valkey
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
---
# Source: app/templates/services.yaml
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  labels:
    aio.platform/service: cloudnative-pg
    app.kubernetes.io/instance: demo
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: demo
    helm.sh/chart: app-0.1.0
    team: shop
  name: shop-cloudnative-pg
spec:
  bootstrap:
    initdb:
      database: shop
      owner: shop
  instances: 1
  storage:
    size: 1Gi
---
# Source: app/templates/services.yaml
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  labels:
    aio.platform/service: cloudnative-pg
    app.kubernetes.io/instance: demo
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: demo
    helm.sh/chart: app-0.1.0
  name: shop-cloudnative-pg-daily
spec:
  cluster:
    name: shop-cloudnative-pg
  schedule: 0 0 3 * * *
