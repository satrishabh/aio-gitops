nameOverride: ""
replicaCount: 1

image:
  repository: ghcr.io/satrishabh/my-app
  tag: "0.0.0"          # overwritten by CI with the git SHA; never "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []    # e.g. [{ name: ghcr-pull }] for private images
extraVolumes: []
extraVolumeMounts: []
serviceAccountName: ""  # optional; workloads needing k8s API access (e.g. the AIO platform)

containerPort: 8080

env: []                 # [{ name: FOO, value: bar }]
envFrom: []             # [{ secretRef: { name: app-secrets } }]

probes:
  liveness:
    path: /health
    initialDelaySeconds: 20
  readiness:
    path: /health
    initialDelaySeconds: 5

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits:   { cpu: 500m, memory: 512Mi }

podSecurityContext:
  runAsNonRoot: true
  fsGroup: 10001
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false   # set true if your app allows it
  capabilities: { drop: [ALL] }

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  host: app.example.com
  tls: false          # HTTPS for host; with issuer set cert-manager issues the certificate (secret <name>-tls)
  issuer: ""          # cert-manager ClusterIssuer, e.g. gts (set by the platform per cluster)
  forceHttps: false   # redirect http -> https
  externalDns: false  # let external-dns create the DNS record (cluster has a managed zone)
  annotations: {}

# Custom domains / path routes (written by the platform's Domains tab):
# - { host: shop.example.com, path: /, tls: true, issuer: gts, certOwner: true,
#     forceHttps: true, wwwRedirect: false, stripPrefix: false, externalDns: false }
routes: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75
  # Optional second signal from the Prometheus Adapter custom-metrics API.
  # Istio, Prometheus scraping and the adapter rule must be installed first.
  istio:
    enabled: false
    metricName: istio_requests_per_second
    requestsPerSecondPerReplica: 25
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - { type: Percent, value: 100, periodSeconds: 60 }
        - { type: Pods, value: 4, periodSeconds: 60 }
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - { type: Percent, value: 25, periodSeconds: 60 }

pdb:
  enabled: false   # enable when replicaCount > 1
  minAvailable: 1

# Blue-green via Argo Rollouts (the platform turns this on for every project's prod)
blueGreen:
  enabled: false
  autoPromotionEnabled: false   # wait for "Promote" in the portal
  scaleDownDelaySeconds: 600    # keep the previous version running 10 min for instant abort
  previewHost: ""               # optional ingress host for the preview Service
