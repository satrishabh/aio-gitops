# Shared private baseline. Add the separately approved public overlay when required.
deployment:
  replicas: 1
service:
  spec:
    type: ClusterIP
ingressClass:
  enabled: true
  isDefaultClass: false
  name: aio-azure
providers:
  kubernetesIngress:
    enabled: true
    ingressClass: aio-azure
    namespaces: [aio-validation]
  kubernetesCRD:
    enabled: false
  kubernetesGateway:
    enabled: false
ingressRoute:
  dashboard:
    enabled: false
api:
  dashboard: false
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 200m, memory: 128Mi}
