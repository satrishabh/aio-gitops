image:
  repository: ghcr.io/satrishabh/aio-platform
  digest: sha256:7a9c896b83cc7133078cc23b2b10c5cee3df4235347d99bd0ca23508d7de732a
imagePullSecrets: [{name: ghcr-pull}]
existingSecret: aio-platform-runtime
serviceAccount:
  name: aio-platform
  create: false
extraVolumes:
  - name: db-trust
    configMap: {name: rehearsal-db-trust}
extraVolumeMounts:
  - {name: db-trust, mountPath: /etc/aio-db, readOnly: true}
config:
  APP_PUBLIC_URL: https://app.sarvaikam.com
  APP_REGISTRY: ghcr.io/satrishabh
  APP_REGISTRY_USER: satrishabh
  GITOPS_REPO_URL: https://github.com/satrishabh/aio-gitops.git
  GITOPS_OWNER: satrishabh
  GITOPS_REPO: aio-gitops
  GITOPS_BRANCH: main
  OIDC_ISSUER_URI: https://profile.sarvaikam.com/realms/aio
  OIDC_CLIENT_ID: aio-platform
  ARGOCD_URL: https://argocd-server.argocd.svc
  ARGOCD_INSECURE: 'true'
  TEKTON_NAMESPACE: ci
  ALLOWED_USERS: ''
  ALLOWED_ROLES: aio-admin,aio-business,aio-community
  APPROVERS: ''
  AIO_INDEPENDENT_DELIVERY: 'false'
  AIO_WORKERS_ENABLED: 'false'
  # was set live by hand (drift) on 2026-11-14; recorded here so a helm upgrade keeps it
  AIO_CI_WORKERS_ENABLED: 'true'
  # v2 saga worker (promotions) and keep-awake lease (renews the Sablier session while work is in flight)
  AIO_SAGA_WORKERS_ENABLED: 'true'
  AIO_KEEP_AWAKE_SABLIER_URL: http://sablier.sablier.svc.cluster.local:10000
  AIO_WORKLOAD_PULL_SECRET: ghcr-readonly
  SPRING_FLYWAY_DEFAULT_SCHEMA: aio_platform
  SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: aio_platform
  APP_CLUSTERS_0_NAME: azure
  APP_CLUSTERS_0_SERVER: https://kubernetes.default.svc
  APP_CLUSTERS_0_ENVS: dev,staging,prod
  APP_CLUSTERS_0_BASEDOMAIN: 52.140.55.184.nip.io
  APP_CLUSTERS_0_INGRESSIP: 52.140.55.184
  APP_CLUSTERS_0_ISSUER: letsencrypt-azure
  APP_CLUSTERS_0_TLS: 'false'
  # Apps on AKS are served by Traefik (IngressClass aio-azure); the app chart renders Traefik Middlewares
  APP_CLUSTERS_0_INGRESSCLASS: aio-azure
  APP_CLUSTERS_0_INGRESSCONTROLLER: traefik
  # Argo CD UI (GitHub SSO) linked from AIO
  TOOLS_ARGOCD_URL: https://argocd.sarvaikam.com
  # Ask AIO / Explain with AIO on the Google Gemini free tier. OFF until AIO_ASSISTANT_API_KEY is added to the
  # aio-platform-runtime Secret (never here: the chart refuses it) and the Ragas eval passes; then set ENABLED 'true'.
  # Free-tier prompts may be used by Google to improve its products, so build logs stay off (SHARE_LOGS 'false').
  AIO_ASSISTANT_ENABLED: 'false'
  AIO_ASSISTANT_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai
  AIO_ASSISTANT_MODEL: gemini-2.5-flash
  AIO_ASSISTANT_REASONING_EFFORT: none
  AIO_ASSISTANT_SHARE_LOGS: 'false'
  # Below the free tier's own limits (check AI Studio for your project's current numbers)
  AIO_ASSISTANT_RPM: '8'
  AIO_ASSISTANT_RPD: '200'
  # Daily summary for admins (scheduled; at most 25% of the daily requests). Enable after the assistant itself.
  AIO_ASSISTANT_DIGEST_ENABLED: 'false'
ingress:
  enabled: false
resources:
  requests: {cpu: 40m, memory: 512Mi}  # idles at ~3m; single-node sizing
  limits: {cpu: '1', memory: 1Gi}
# preStop drain: keep serving while Traefik removes the endpoint (no 502s on rollout)
terminationDrainSeconds: 8
