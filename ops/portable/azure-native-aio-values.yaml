    configMap: {name: rehearsal-db-trust}
extraVolumeMounts:
  - {name: db-trust, mountPath: /etc/aio-db, readOnly: true}
config:
  APP_PUBLIC_URL: https://app.sarvaikam.com
  APP_REGISTRY: ghcr.io/satrishabh
  APP_REGISTRY_USER: satrishabh
  GITOPS_REPO_URL: https://github.com/satrishabh/aio-gitops.git
