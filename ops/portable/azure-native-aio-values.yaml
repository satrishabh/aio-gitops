  APP_CLUSTERS_0_SERVER: https://kubernetes.default.svc
  APP_CLUSTERS_0_ENVS: dev,staging,prod
  APP_CLUSTERS_0_BASEDOMAIN: 52.140.55.184.nip.io
  APP_CLUSTERS_0_INGRESSIP: 52.140.55.184
  APP_CLUSTERS_0_ISSUER: letsencrypt-azure
  APP_CLUSTERS_0_TLS: 'false'
ingress:
  enabled: false
resources:
  requests: {cpu: 100m, memory: 512Mi}
  limits: {cpu: '1', memory: 1Gi}
