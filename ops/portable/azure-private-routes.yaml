# Learn rehearsal route; root homepage has a separate production route/certificate.
# This Learn self-signed test certificate is NOT suitable for its public cutover.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: azure-private-route-test
  namespace: aio-validation
spec:
  secretName: azure-private-route-test-tls
  commonName: learn.sarvaikam.com
  subject:
    organizations: [AIO private route test]
  dnsNames: [learn.sarvaikam.com]
  duration: 168h
  renewBefore: 24h
  issuerRef:
    name: validation-selfsigned
    kind: Issuer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: azure-private-routes
  namespace: aio-validation
spec:
  ingressClassName: aio-azure
  tls:
    - hosts: [learn.sarvaikam.com]
      secretName: azure-private-route-test-tls
  rules:
    - host: learn.sarvaikam.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sarvaikam-learn
                port: {number: 8080}
