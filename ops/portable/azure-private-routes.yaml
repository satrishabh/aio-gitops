# Historical rehearsal test certificate only; no route on the public controller.
# Reach the isolated Learn service through Kubernetes port-forward, not public DNS.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: azure-private-route-test
  namespace: aio-validation
spec:
  secretName: azure-private-route-test-tls
  commonName: azure-learn.validation.invalid
  subject:
    organizations: [AIO private route test]
  dnsNames: [azure-learn.validation.invalid]
  duration: 168h
  renewBefore: 24h
  issuerRef:
    name: validation-selfsigned
    kind: Issuer
