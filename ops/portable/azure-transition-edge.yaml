# Temporary Azure TLS edge -> existing GCP applications. No database copy/authority move.
apiVersion: v1
kind: ConfigMap
metadata:
  name: transition-edge-nginx
  namespace: aio-validation
data:
  nginx.conf: |
    pid /tmp/transition-nginx.pid;
    error_log /dev/stderr;
    events { worker_connections 256; }
    http {
      access_log off;
      map $http_upgrade $connection_upgrade { default upgrade; '' close; }
      server {
        listen 8080 default_server;
        server_name _;
        location = /health { return 200 "ok\n"; }
        location / { return 404; }
      }
      server {
        listen 8080;
        server_name learn.sarvaikam.com profile.sarvaikam.com blog.sarvaikam.com app.sarvaikam.com;
        if ($http_x_forwarded_proto = http) { return 308 https://$host$request_uri; }
        client_max_body_size 64m;
        location = /health { return 200 "ok\n"; }
        location / {
          proxy_pass https://34.180.3.18;
          proxy_ssl_server_name on;
          proxy_ssl_session_reuse off;
          proxy_ssl_name $host;
          proxy_ssl_verify on;
          proxy_ssl_verify_depth 4;
          proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_read_timeout 300s;
          proxy_buffering off;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transition-edge
  namespace: aio-validation
spec:
  replicas: 1
  selector:
    matchLabels: {app: transition-edge}
  template:
    metadata:
      labels: {app: transition-edge}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{name: ghcr-readonly}]
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: proxy
          image: ghcr.io/satrishabh/sarvaikam-home@sha256:e3c2bdd31be308169d9cedfc8f33e1480597964056caa56dfff89eb8cfa01983
          command: [nginx, '-p', /tmp/, '-c', /etc/transition/nginx.conf, '-g', 'daemon off;']
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /health, port: http}
          livenessProbe:
            httpGet: {path: /health, port: http}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/transition, readOnly: true}
      volumes:
        - name: config
          configMap: {name: transition-edge-nginx}
---
apiVersion: v1
kind: Service
metadata:
  name: transition-edge
  namespace: aio-validation
spec:
  selector: {app: transition-edge}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: transition-domains-public
  namespace: aio-validation
spec:
  secretName: transition-domains-public-tls
  dnsNames: [learn.sarvaikam.com, profile.sarvaikam.com, blog.sarvaikam.com, app.sarvaikam.com]
  privateKey:
    rotationPolicy: Always
  issuerRef:
    name: homepage-letsencrypt
    kind: Issuer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transition-domains-public
  namespace: aio-validation
spec:
  ingressClassName: aio-azure
  tls:
    - hosts: [learn.sarvaikam.com, profile.sarvaikam.com, blog.sarvaikam.com, app.sarvaikam.com]
      secretName: transition-domains-public-tls
  rules:
    - host: learn.sarvaikam.com
      http: &routes
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: transition-edge
                port: {number: 8080}
    - host: profile.sarvaikam.com
      http: *routes
    - host: blog.sarvaikam.com
      http: *routes
    - host: app.sarvaikam.com
      http: *routes
