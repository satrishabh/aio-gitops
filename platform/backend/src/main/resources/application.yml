server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: aio-platform
  datasource:
    # Local: jdbc:postgresql://localhost:5432/aio
    # Cloud SQL: jdbc:postgresql:///aio?cloudSqlInstance=<project>:<region>:<instance>&socketFactory=com.google.cloud.sql.postgres.SocketFactory
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aio}
    username: ${DB_USER:aio}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}   # small Cloud SQL tiers allow few connections
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          profile:
            provider: profile
            client-id: ${OIDC_CLIENT_ID:aio-platform}
            client-secret: ${OIDC_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
            client-name: User Profile Manager
        provider:
          profile:
            issuer-uri: ${OIDC_ISSUER_URI:https://profile.sarvaikam.com/realms/aio}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  # Public URL of this portal; used to register GitHub webhooks (leave empty to skip)
  public-url: ${APP_PUBLIC_URL:}
  # Image prefix; image = <registry>/<project-name>
  registry: ${APP_REGISTRY:ghcr.io/satrishabh}
  # Username paired with GITHUB_TOKEN for the ghcr-pull secret the platform puts in each app namespace
  registry-user: ${APP_REGISTRY_USER:satrishabh}
  cleanup:
    keep-per-project: 5
    max-age-hours: 24
  # Optional: if set, each env gets ingress host <project>-<env>.<base-domain>
  base-domain: ${APP_BASE_DOMAIN:}
  tekton:
    namespace: ${TEKTON_NAMESPACE:ci}
    pipeline: ci-pipeline
    service-account: pipeline-runner
    storage-size: 2Gi
    registry-secret: registry-credentials
    github-token-secret: github-token
    # Max duration of a whole CI/CD run; longer runs are stopped and marked failed
    timeout: ${PIPELINE_TIMEOUT:15m}
  gitops:
    repo-url: ${GITOPS_REPO_URL:https://github.com/satrishabh/aio-gitops.git}
    owner: ${GITOPS_OWNER:satrishabh}
    repo: ${GITOPS_REPO:aio-gitops}
    branch: ${GITOPS_BRANCH:main}
    apps-path: apps
    chart-path: helm/app
  argocd:
    url: ${ARGOCD_URL:https://argocd-server.argocd.svc}
    token: ${ARGOCD_TOKEN:}
    project: apps
    destination-server: https://kubernetes.default.svc
    insecure: ${ARGOCD_INSECURE:true}
  github:
    api-url: https://api.github.com
    token: ${GITHUB_TOKEN:}
  delivery:
    independent: ${AIO_INDEPENDENT_DELIVERY:false}
    pipeline: ci-build-v2
    source-secret: ${AIO_SOURCE_SECRET:github-source-token}
    registry-read-secret: ${AIO_REGISTRY_READ_SECRET:registry-read-credentials}
    registry-hosts: ${AIO_REGISTRY_HOSTS:ghcr.io,index.docker.io,docker.io}
    test-images: ${AIO_TEST_IMAGES:alpine:3.20,node:20-alpine,python:3.12-slim,maven:3.9-eclipse-temurin-21,golang:1.23-alpine}
  tools:
    argocd-url: ${TOOLS_ARGOCD_URL:}
    tekton-url: ${TOOLS_TEKTON_URL:}
  security:
    # Comma-separated OIDC usernames/emails and/or AIO client roles. If all are empty, any realm user can log in.
    allowed-users: ${ALLOWED_USERS:}
    allowed-roles: ${ALLOWED_ROLES:}
    # Deprecated: brokered OIDC sessions do not expose GitHub organization membership.
    allowed-orgs: ${ALLOWED_ORGS:}
    # Who may approve production promotions. Empty = any logged-in user except the requester.
    approvers: ${APPROVERS:}
