server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: aio-platform
  jackson:
    # Spring Boot 4 uses Jackson 3; keep the JSON the API produced/accepted under Boot 3 (Jackson 2 defaults)
    use-jackson2-defaults: true
  datasource:
    # Local: jdbc:postgresql://localhost:5432/aio
    # Azure (AKS): in-cluster PostgreSQL over TLS, see ops/portable/azure-native-aio-values.yaml
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aio}
    username: ${DB_USER:aio}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}   # small Cloud SQL tiers allow few connections
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          profile:
            provider: profile
            client-id: ${OIDC_CLIENT_ID:aio-platform}
            client-secret: ${OIDC_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
            client-name: User Profile Manager
        provider:
          profile:
            issuer-uri: ${OIDC_ISSUER_URI:https://profile.sarvaikam.com/realms/aio}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  runtime:
    workers-enabled: ${AIO_WORKERS_ENABLED:true}
    # CI tracking only (Tekton run/scan status, step logs, CI PipelineRun pruning in the CI namespace).
    # Defaults to workers-enabled; lets CI be observed while delivery reconcilers stay off.
    ci-workers-enabled: ${AIO_CI_WORKERS_ENABLED:${AIO_WORKERS_ENABLED:true}}
  # Public URL of this portal; used to register GitHub webhooks (leave empty to skip)
  public-url: ${APP_PUBLIC_URL:}
  # Image prefix; image = <registry>/<project-name>
  registry: ${APP_REGISTRY:ghcr.io/satrishabh}
  # Username paired with GITHUB_TOKEN for the ghcr-pull secret the platform puts in each app namespace
  registry-user: ${APP_REGISTRY_USER:satrishabh}
  cleanup:
    keep-per-project: 5
    max-age-hours: 24
  # Optional: if set, each env gets ingress host <project>-<env>.<base-domain>
  base-domain: ${APP_BASE_DOMAIN:}
  tekton:
    namespace: ${TEKTON_NAMESPACE:ci}
    pipeline: ci-pipeline
    service-account: pipeline-runner
    storage-size: ${TEKTON_STORAGE_SIZE:2Gi}
    # Workspace volume class for every run. Empty = cluster default (a managed disk per run).
    # On AKS set TEKTON_STORAGE_CLASS=aio-ci-blob to keep workspaces in Azure Blob instead (tekton/storage/).
    storage-class: ${TEKTON_STORAGE_CLASS:}
    registry-secret: registry-credentials
    github-token-secret: github-token
    # Max duration of a whole CI/CD run; longer runs are stopped and marked failed
    timeout: ${PIPELINE_TIMEOUT:15m}
  gitops:
    repo-url: ${GITOPS_REPO_URL:https://github.com/satrishabh/aio-gitops.git}
    owner: ${GITOPS_OWNER:satrishabh}
    repo: ${GITOPS_REPO:aio-gitops}
    branch: ${GITOPS_BRANCH:main}
    apps-path: apps
    chart-path: helm/app
  argocd:
    url: ${ARGOCD_URL:https://argocd-server.argocd.svc}
    token: ${ARGOCD_TOKEN:}
    project: apps
    destination-server: https://kubernetes.default.svc
    insecure: ${ARGOCD_INSECURE:true}
  github:
    api-url: https://api.github.com
    token: ${GITHUB_TOKEN:}
  delivery:
    independent: ${AIO_INDEPENDENT_DELIVERY:false}
    pipeline: ci-build-v2
    source-secret: ${AIO_SOURCE_SECRET:github-source-token}
    registry-read-secret: ${AIO_REGISTRY_READ_SECRET:registry-read-credentials}
    registry-hosts: ${AIO_REGISTRY_HOSTS:ghcr.io,index.docker.io,docker.io}
    test-images: ${AIO_TEST_IMAGES:alpine:3.20,node:20-alpine,python:3.12-slim,maven:3.9-eclipse-temurin-21,golang:1.23-alpine}
    # Run CI and scan pipelines on spot capacity: aks (spot node pool) | gke (aio-spot compute class) | off
    ci-spot: ${CI_SPOT:off}
  tools:
    argocd-url: ${TOOLS_ARGOCD_URL:}
    tekton-url: ${TOOLS_TEKTON_URL:}
    grafana-url: ${TOOLS_GRAFANA_URL:}
  assistant:
    # Claude API key; empty = the assistant is off. Conversations (and the tool data in them) are sent to the
    # Anthropic API; secrets in logs and files are redacted first.
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ASSISTANT_MODEL:claude-opus-5-5}
    effort: ${ASSISTANT_EFFORT:medium}
    max-steps: ${ASSISTANT_MAX_STEPS:8}
  connectors:
    # The open-source catalog repository (aio-catalog) and the tag to use. AIO reads dist/catalog.yaml from it,
    # and Argo CD reads values and extras from it. Empty = built-in core-only list.
    repo: ${CONNECTORS_REPO:}
    revision: ${CONNECTORS_REVISION:}
    # Alternative to repo: a catalog file path or https URL
    catalog: ${CONNECTORS_CATALOG:}
    # any | gke | eks | aks | oke | onprem - selects values-<cloud>.yaml and hides tools not for this cloud
    cloud: ${CLOUD_PROVIDER:any}
    # installation name selecting site-<site>.yaml overlays (domains, issuer, ingress), e.g. sarvaikam
    site: ${CONNECTORS_SITE:}
    # New apps' dev/staging values get spot.enabled when the node-autoprovisioning connector is installed on
    # this cluster (CLOUD_PROVIDER aks or gke). auto | off. Existing apps are never changed.
    spot-for-new-apps: ${SPOT_FOR_NEW_APPS:auto}
  security:
    # Comma-separated OIDC usernames/emails and/or AIO client roles. If all are empty, any realm user can log in.
    allowed-users: ${ALLOWED_USERS:}
    allowed-roles: ${ALLOWED_ROLES:}
    # Deprecated: brokered OIDC sessions do not expose GitHub organization membership.
    allowed-orgs: ${ALLOWED_ORGS:}
    # Who may approve production promotions. Empty = any logged-in user except the requester.
    approvers: ${APPROVERS:}
