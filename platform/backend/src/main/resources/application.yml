server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: aio-platform
  datasource:
    # Local: jdbc:postgresql://localhost:5432/aio
    # Azure (AKS): in-cluster PostgreSQL over TLS, see ops/portable/azure-native-aio-values.yaml
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aio}
    username: ${DB_USER:aio}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}   # small Cloud SQL tiers allow few connections
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  task:
    scheduling:
      # @Scheduled pollers used to share ONE thread, so a slow GitHub/Argo call delayed every other poller
      pool:
        size: ${AIO_SCHEDULER_THREADS:4}
  security:
    oauth2:
      client:
        registration:
          profile:
            provider: profile
            client-id: ${OIDC_CLIENT_ID:aio-platform}
            client-secret: ${OIDC_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
            client-name: User Profile Manager
        provider:
          profile:
            issuer-uri: ${OIDC_ISSUER_URI:https://profile.sarvaikam.com/realms/aio}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  runtime:
    workers-enabled: ${AIO_WORKERS_ENABLED:true}
    # CI tracking only (Tekton run/scan status, step logs, CI PipelineRun pruning in the CI namespace).
    # Defaults to workers-enabled; lets CI be observed while delivery reconcilers stay off.
    ci-workers-enabled: ${AIO_CI_WORKERS_ENABLED:${AIO_WORKERS_ENABLED:true}}
    # Saga worker (promotions today; releases/provisioning next). Independent of workers-enabled because
    # promotions depend on it. See docs/architecture/AIO-V2-ARCHITECTURE.md.
    saga-workers-enabled: ${AIO_SAGA_WORKERS_ENABLED:true}
  # Keep the Sablier scale-to-zero group awake while sagas, CI runs or scans are in flight (empty = off)
  keep-awake:
    sablier-url: ${AIO_KEEP_AWAKE_SABLIER_URL:}
    group: ${AIO_KEEP_AWAKE_GROUP:aio}
  promotion:
    verify-health: ${AIO_PROMOTION_VERIFY_HEALTH:true}
    timeout: ${AIO_PROMOTION_TIMEOUT:PT20M}
    # Failure strategy: environments listed here pause a failed deployment for an approver (retry / skip /
    # rollback) instead of rolling back at once; nobody deciding within intervention-timeout rolls back.
    manual-intervention-envs: ${AIO_PROMOTION_MANUAL_ENVS:}
    intervention-timeout: ${AIO_PROMOTION_INTERVENTION_TIMEOUT:PT2H}
    # Smoke test after Argo reports Healthy: GET <public URL><path> until `samples` answers without 5xx;
    # `failure-limit` bad samples fail the deployment. Skipped for environments without a public URL.
    smoke:
      enabled: ${AIO_PROMOTION_SMOKE:true}
      path: ${AIO_PROMOTION_SMOKE_PATH:/}
      samples: ${AIO_PROMOTION_SMOKE_SAMPLES:4}
      failure-limit: ${AIO_PROMOTION_SMOKE_FAILURE_LIMIT:2}
      interval: ${AIO_PROMOTION_SMOKE_INTERVAL:PT15S}
  # Deployment freeze windows, e.g. "prod@FRI 18:00/MON 09:00#weekend; *@2026-12-24T00:00/2026-12-27T00:00#holidays"
  freeze:
    windows: ${AIO_FREEZE_WINDOWS:}
    zone: ${AIO_FREEZE_ZONE:Asia/Kolkata}
  # "Ask AIO" assistant (read-only RAG over resources/knowledge). Off unless enabled AND a base URL and model are set.
  # Any OpenAI-compatible endpoint: e.g. https://api.groq.com/openai/v1, https://openrouter.ai/api/v1,
  # or a local Ollama http://ollama.ollama.svc:11434/v1. The key must come from a Kubernetes Secret.
  assistant:
    enabled: ${AIO_ASSISTANT_ENABLED:false}
    # Default provider: Google Gemini free tier, e.g. https://generativelanguage.googleapis.com/v1beta/openai
    # with model "gemini-3.1-flash-lite,gemini-3.5-flash" and reasoning-effort none. Any OpenAI-compatible endpoint works.
    # A comma-separated model list is tried in order: free tiers limit each model separately (Gemini: 20 a day for Flash).
    base-url: ${AIO_ASSISTANT_BASE_URL:}
    api-key: ${AIO_ASSISTANT_API_KEY:}
    model: ${AIO_ASSISTANT_MODEL:}
    timeout: ${AIO_ASSISTANT_TIMEOUT:PT45S}
    max-question-chars: ${AIO_ASSISTANT_MAX_QUESTION:2000}
    max-output-tokens: ${AIO_ASSISTANT_MAX_OUTPUT_TOKENS:800}
    per-user-per-hour: ${AIO_ASSISTANT_PER_USER_PER_HOUR:20}
    daily-limit: ${AIO_ASSISTANT_DAILY_LIMIT:300}
    top-k: ${AIO_ASSISTANT_TOP_K:5}
    # Sent as reasoning_effort when set. Gemini 3.5 Flash: none = no thinking (fast; the whole budget goes to the answer).
    reasoning-effort: ${AIO_ASSISTANT_REASONING_EFFORT:}
    # G2 "explain a failure": include the last 60 log lines of failed steps (redacted). Off: metadata only.
    share-logs: ${AIO_ASSISTANT_SHARE_LOGS:false}
    # Provider limits, set a little below the provider's own (Gemini free tier counts per Google Cloud project and
    # resets the day at midnight Pacific). Scheduled jobs may use only background-share of the daily requests.
    limits:
      requests-per-minute: ${AIO_ASSISTANT_RPM:8}
      tokens-per-minute: ${AIO_ASSISTANT_TPM:200000}
      requests-per-day: ${AIO_ASSISTANT_RPD:200}
      background-share: ${AIO_ASSISTANT_BACKGROUND_SHARE:0.25}
      day-zone: ${AIO_ASSISTANT_DAY_ZONE:America/Los_Angeles}
    # G6 scheduled task: daily delivery summary for admins, written the first time AIO is awake after `hour`.
    digest:
      enabled: ${AIO_ASSISTANT_DIGEST_ENABLED:false}
      hour: ${AIO_ASSISTANT_DIGEST_HOUR:9}
      zone: ${AIO_ASSISTANT_DIGEST_ZONE:Asia/Kolkata}
      max-wait: ${AIO_ASSISTANT_DIGEST_MAX_WAIT:PT10M}
  # Public URL of this portal; used to register GitHub webhooks (leave empty to skip)
  public-url: ${APP_PUBLIC_URL:}
  # Image prefix; image = <registry>/<project-name>
  registry: ${APP_REGISTRY:ghcr.io/satrishabh}
  # Username paired with GITHUB_TOKEN for the ghcr-pull secret the platform puts in each app namespace
  registry-user: ${APP_REGISTRY_USER:satrishabh}
  cleanup:
    keep-per-project: 5
    max-age-hours: 24
  # Optional: if set, each env gets ingress host <project>-<env>.<base-domain>
  base-domain: ${APP_BASE_DOMAIN:}
  tekton:
    namespace: ${TEKTON_NAMESPACE:ci}
    pipeline: ci-pipeline
    service-account: pipeline-runner
    storage-size: 2Gi
    registry-secret: registry-credentials
    github-token-secret: github-token
    # Max duration of a whole CI/CD run; longer runs are stopped and marked failed
    timeout: ${PIPELINE_TIMEOUT:15m}
  gitops:
    repo-url: ${GITOPS_REPO_URL:https://github.com/satrishabh/aio-gitops.git}
    owner: ${GITOPS_OWNER:satrishabh}
    repo: ${GITOPS_REPO:aio-gitops}
    branch: ${GITOPS_BRANCH:main}
    apps-path: apps
    chart-path: helm/app
  argocd:
    url: ${ARGOCD_URL:https://argocd-server.argocd.svc}
    token: ${ARGOCD_TOKEN:}
    project: apps
    destination-server: https://kubernetes.default.svc
    insecure: ${ARGOCD_INSECURE:true}
  github:
    api-url: https://api.github.com
    token: ${GITHUB_TOKEN:}
  delivery:
    independent: ${AIO_INDEPENDENT_DELIVERY:false}
    pipeline: ci-build-v2
    source-secret: ${AIO_SOURCE_SECRET:github-source-token}
    registry-read-secret: ${AIO_REGISTRY_READ_SECRET:registry-read-credentials}
    registry-hosts: ${AIO_REGISTRY_HOSTS:ghcr.io,index.docker.io,docker.io}
    test-images: ${AIO_TEST_IMAGES:alpine:3.20,node:20-alpine,python:3.12-slim,maven:3.9-eclipse-temurin-21,golang:1.23-alpine}
  tools:
    argocd-url: ${TOOLS_ARGOCD_URL:}
    tekton-url: ${TOOLS_TEKTON_URL:}
  security:
    # Comma-separated OIDC usernames/emails and/or AIO client roles. If all are empty, any realm user can log in.
    allowed-users: ${ALLOWED_USERS:}
    allowed-roles: ${ALLOWED_ROLES:}
    # Deprecated: brokered OIDC sessions do not expose GitHub organization membership.
    allowed-orgs: ${ALLOWED_ORGS:}
    # Who may approve production promotions. Empty = any logged-in user except the requester.
    approvers: ${APPROVERS:}
