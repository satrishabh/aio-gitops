    HTTPS.
- id: harbor
  name: Harbor
  category: Security
  kind: managed
  phase: '5'
  description: Private container registry with projects, robot accounts, retention rules, replication and Keycloak
    login. Any cloud; images on a 20 Gi disk, database on CloudNativePG. Image scanning stays in the AIO pipeline
    and the Trivy Operator, so Harbor's own scanner is off.
  namespace: harbor
  deployment: harbor-core
  chartRepo: https://helm.goharbor.io
  chart: harbor
  version: 1.19.4
  previousVersion: 1.19.2
  releaseName: harbor
  valuesPath: values/harbor/values.yaml
  siteValues:
    sarvaikam: values/harbor/site-sarvaikam.yaml
  extrasPath: extras/harbor
  requires:
  - cloudnative-pg
  accessHint: 'Run setup/harbor-secrets.sh (aio-catalog) before Enable. With a site overlay: https://harbor.<tools
    domain> (sarvaikam: harbor.tools.sarvaikam.com). Otherwise kubectl -n harbor port-forward svc/harbor 8080:80.
    Admin password: kubectl -n harbor get secret harbor-secrets -o jsonpath=''{.data.HARBOR_ADMIN_PASSWORD}'' |
    base64 -d'
  probes:
  - name: Harbor API
    url: http://harbor-core.harbor.svc/api/v2.0/ping
    expect: Pong
  - name: All Harbor components healthy
    url: http://harbor-core.harbor.svc/api/v2.0/health
    expect: '"status":"healthy"'
  sso:
    mode: oidc
    clientId: aio-harbor
  license: Apache-2.0
  foundation: CNCF (graduated)
  origin: China (VMware China R&D)
  homepage: https://goharbor.io
- id: openbao
  name: OpenBao
  category: Security
  kind: managed
  phase: '6'
  description: Secrets manager (open-source fork of Vault, which is no longer OSI-licensed) with the web UI. One
    server with integrated Raft storage on a 2 Gi disk, any cloud. Starts sealed after every restart; setup/openbao-init.sh
    initialises and unseals it. Apps read secrets through External Secrets (provider vault) or the API.
  namespace: openbao
  chartRepo: https://openbao.github.io/openbao-helm
  chart: openbao
  version: 0.30.6
  previousVersion: 0.30.5
  releaseName: openbao
  valuesPath: values/openbao/values.yaml
  accessHint: 'After Enable run setup/openbao-init.sh (aio-catalog): it initialises, stores the unseal key and root
    token in Secret openbao/openbao-init (move it offline, then delete it) and unseals. After every restart of openbao-0
    run it again (UNSEAL_KEY_FILE=<keys file> once the Secret is gone). UI: kubectl -n openbao port-forward svc/openbao-ui
    8200:8200, then http://localhost:8200/ui. API in-cluster: http://openbao.openbao.svc:8200'
  probes:
  - name: OpenBao initialised and unsealed
    url: http://openbao.openbao.svc:8200/v1/sys/health?standbyok=true&sealedcode=503&uninitcode=501
    expect: '"sealed":false'
  license: MPL-2.0
  foundation: Linux Foundation (OpenSSF)
  homepage: https://openbao.org
- id: trivy-operator
  name: Trivy Operator
  category: Security
  kind: managed
  phase: '2'
  description: Rescans what is running for new CVEs, misconfigurations and exposed secrets; reports expire after
    24h so every workload is rescanned daily. Complements the Trivy step in CI, which only sees images at build
    time.
  namespace: trivy-system
  deployment: trivy-operator
  chartRepo: https://aquasecurity.github.io/helm-charts/
  chart: trivy-operator
  version: 0.38.1
  previousVersion: 0.37.0
  releaseName: trivy-operator
  valuesPath: values/trivy-operator/values.yaml
  accessHint: kubectl get vulnerabilityreports -n dev -o wide (also -n staging, -n prod; configauditreports for
    misconfigurations)
  probes:
  - name: Operator metrics
    url: http://trivy-operator.trivy-system.svc:8080/metrics
    expect: trivy_
  license: Apache-2.0
  foundation: Independent (Aqua Security)
  homepage: https://aquasecurity.github.io/trivy-operator
- id: renovate
