    savepoints and restarts it. Installs only the operator and its webhook; no Flink cluster runs until an app declares
    one. Jobs use the official Apache Flink images. Any cloud.'
  requires:
  - cert-manager
  namespace: flink-operator
  deployment: flink-kubernetes-operator
