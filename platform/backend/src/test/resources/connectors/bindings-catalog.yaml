  license: Apache-2.0
  foundation: Apache
  homepage: https://nightlies.apache.org/flink/flink-kubernetes-operator-docs-stable/
  pinNote: Apache publishes one Helm repository per operator release, so chartRepo is version-specific and there
    is no previousVersion in the same repository (Roll back is unavailable; 1.15.0 lives at .../flink-kubernetes-operator-1.15.0/
    and renders with the same values). Move chartRepo and version together, and switch to archive.apache.org/dist/flink/
    if Apache drops 1.16.1 from downloads.apache.org. The image tag is the release commit (ghcr.io/apache/flink-kubernetes-operator:1c895a3)
    as pinned by the chart. Jobs are allowed in dev and staging only; the chart writes Roles and the flink ServiceAccount
