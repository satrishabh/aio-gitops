- id: opensearch
  name: OpenSearch
  category: Observability
  kind: managed
  phase: '7'
  description: 'Search engine for apps (full-text, faceted and vector search), via the OpenSearch Kubernetes Operator:
    an app gets its own OpenSearch cluster from one small OpenSearchCluster manifest in its namespace, with the
    security plugin on, an admin password from a setup script and TLS from a cert-manager CA (no demo users or certificates).
    Installs only the operator; no cluster runs until an app declares one. No privileged sysctl on the nodes. Any
    cloud: data on disks from the default StorageClass. Platform logs stay in Loki.'
  namespace: opensearch-operator
  deployment: opensearch-operator
  chartRepo: https://opensearch-project.github.io/opensearch-k8s-operator
  chart: opensearch-operator
  version: 3.0.14
  previousVersion: 3.0.12
  releaseName: opensearch-operator
  valuesPath: values/opensearch/values.yaml
  extrasPath: extras/opensearch
  requires:
  - cert-manager
  accessHint: 'kubectl get opensearchclusters -A. A cluster for an app: run setup/opensearch-cluster-secrets.sh
    <ns> <cluster> (aio-catalog), then apply the example in values/opensearch/values.yaml; the app uses https://<cluster>.<ns>.svc:9200
    and trusts ca.crt from Secret <cluster>-ca.'
  probes:
  - name: Operator ready
    url: http://opensearch-operator-health.opensearch-operator.svc:8081/readyz
    expect: ok
  license: Apache-2.0
  foundation: Linux Foundation (OpenSearch Software Foundation)
  homepage: https://opensearch.org
  pinNote: Operator chart repo (opensearch-k8s-operator), not the plain opensearch chart. The rollback target 3.0.12
    runs operator image 3.0.0-beta (its chart appVersion); the charts are otherwise identical.
  binding:
    label: OpenSearch cluster
    summary: Your own 1-node OpenSearch with the security plugin and TLS, admin password generated by the operator.
    scope: instance
    envs:
    - dev
    - staging
    - prod
    options:
    - id: disk
      label: Disk size
      default: 5Gi
      choices:
      - 5Gi
      - 10Gi
      - 20Gi
    manifests: bindings/opensearch.yaml
    env:
    - name: OPENSEARCH_URL
      value: https://${name}.${namespace}.svc:9200
    - name: OPENSEARCH_USERNAME
      secret: ${name}-admin-password
      key: username
    - name: OPENSEARCH_PASSWORD
      secret: ${name}-admin-password
      key: password
    - name: OPENSEARCH_CA_CERT
      secret: ${name}-ca
      key: ca.crt
    exportNote: Needs the OpenSearch operator (connectors/opensearch) and cert-manager. The operator creates Secret
      <app>-opensearch-admin-password (username, password) and cert-manager Secret <app>-opensearch-ca (ca.crt);
      the app uses the admin user, so create a user per app for production. Detaching deletes the cluster.
    manifestsText: |
      # Binding template for the "opensearch" connector (OpenSearch operator): one app's own 1-node OpenSearch cluster,
      # security plugin on, TLS from a per-cluster cert-manager CA. Placeholders are replaced by the AIO platform (plain
      # string substitution) before the text goes into the app's values.
      # No admin Secret is needed up front: without spec.security.config.adminCredentialsSecret the operator generates
      # Secret ${name}-admin-password (keys username = admin, password = random) at first reconcile and uses it.
      # Apps trust ca.crt from Secret ${name}-ca for https://${name}.${namespace}.svc:9200.
      apiVersion: cert-manager.io/v1
      kind: Issuer
      metadata:
        name: ${name}-selfsigned
      spec:
        selfSigned: {}
      ---
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: ${name}-ca
      spec:
        isCA: true
        commonName: ${name}-ca
        secretName: ${name}-ca
        duration: 87600h
        privateKey: { algorithm: RSA, size: 2048 }
        issuerRef: { name: ${name}-selfsigned, kind: Issuer }
      ---
      apiVersion: opensearch.org/v1
      kind: OpenSearchCluster
      metadata:
        name: ${name}
      spec:
        general:
          serviceName: ${name}
          version: "3.9.0"
          httpPort: 9200
          setVMMaxMapCount: false
          additionalConfig:
            node.store.allow_mmap: "false"
          podSecurityContext: { runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, runAsNonRoot: true }
          securityContext: { allowPrivilegeEscalation: false }
        bootstrap:
          resources:
            requests: { cpu: 100m, memory: 768Mi }
            limits: { memory: 768Mi }
        nodePools:
          - component: nodes
            replicas: 1
            diskSize: ${opt.disk}
            roles: [cluster_manager, data]
            resources:
              requests: { cpu: 250m, memory: 1Gi }
              limits: { memory: 1Gi }
        security:
          tls:
            transport:
              generate: true
              perNode: true
              caSecret: { name: ${name}-ca }
            http:
              generate: true
              caSecret: { name: ${name}-ca }
        dashboards:
          enable: false
