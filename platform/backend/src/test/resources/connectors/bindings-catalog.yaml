- id: strimzi
  name: Apache Kafka (Strimzi)
  category: Messaging
  kind: managed
  phase: '6'
  description: 'Kafka operator for apps: an app gets its own KRaft Kafka cluster, topics and users from small Kafka,
    KafkaNodePool and KafkaTopic manifests in its namespace. Installs only the cluster operator (watches all namespaces);
    no Kafka cluster runs until an app declares one. Any cloud: data on disks from the default StorageClass.'
  namespace: strimzi
  deployment: strimzi-cluster-operator
  chartRepo: https://strimzi.io/charts/
  chart: strimzi-kafka-operator
  version: 1.3.1
  previousVersion: 1.3.0
  releaseName: strimzi
  valuesPath: values/strimzi/values.yaml
  extrasPath: extras/strimzi
  accessHint: 'kubectl get kafka,kafkanodepool,kafkatopic -A. A Kafka cluster for an app: see the single-node KRaft
    example in values/strimzi/values.yaml (aio-catalog); the app connects to <cluster>-kafka-bootstrap.<ns>.svc:9092.'
  probes:
  - name: Operator reconciling Kafka resources
    url: http://strimzi-cluster-operator-metrics.strimzi.svc:8080/metrics
    expect: strimzi_reconciliations_periodical_total{kind="Kafka"
  license: Apache-2.0
  foundation: CNCF (incubating) / Apache Kafka
  homepage: https://strimzi.io
  binding:
    label: Kafka cluster
    summary: Your own single-node Kafka (KRaft) in this environment, plain listener inside the cluster.
    scope: instance
    envs:
    - dev
    - staging
    - prod
    options:
    - id: storage
      label: Disk size
      default: 5Gi
      choices:
      - 5Gi
      - 10Gi
      - 20Gi
    manifests: bindings/strimzi.yaml
    env:
    - name: KAFKA_BOOTSTRAP_SERVERS
      value: ${name}-kafka-bootstrap:9092
    exportNote: Needs the Strimzi operator (connectors/strimzi). Single broker and replication factor 1; detaching
      deletes the cluster and its data.
    manifestsText: |
      # Binding template for the "strimzi" connector: one app's own single-node KRaft Kafka cluster.
      # Placeholders are replaced by the AIO platform (plain string substitution) before the text goes into the app's values.
      # The app connects to ${name}-kafka-bootstrap:9092 (plain listener, in-cluster only). Topics: KafkaTopic resources
      # labelled strimzi.io/cluster: ${name}, or auto-creation by the client.
      apiVersion: kafka.strimzi.io/v1
      kind: KafkaNodePool
      metadata:
        name: ${app}-kafka                 # pods are <cluster>-<pool>-<n>: keep the pool name short
        labels: { strimzi.io/cluster: ${name} }
      spec:
        replicas: 1
        roles: [controller, broker]
        storage: { type: persistent-claim, size: ${opt.storage}, deleteClaim: true }
        resources:
          requests: { cpu: 100m, memory: 768Mi }
          limits: { memory: 1Gi }
      ---
      apiVersion: kafka.strimzi.io/v1
      kind: Kafka
      metadata:
        name: ${name}
      spec:
        kafka:
          listeners:
            - { name: plain, port: 9092, type: internal, tls: false }
          config:
            offsets.topic.replication.factor: 1
            transaction.state.log.replication.factor: 1
            transaction.state.log.min.isr: 1
            default.replication.factor: 1
            min.insync.replicas: 1
        entityOperator:
          topicOperator:
            resources:
              requests: { cpu: 20m, memory: 128Mi }
              limits: { memory: 256Mi }
