- id: airflow
  name: Apache Airflow
  category: Workflow
  kind: managed
  phase: '6'
  description: Data and batch workflows as Python DAGs (Airflow 3) with a web UI, REST API and Keycloak login. Sized
    for a small cluster with the LocalExecutor (tasks run in the scheduler pod, up to 4 at a time; no Celery, Redis
    or pod per task), metadata database on CloudNativePG, task logs on a 2 Gi disk. DAGs come from a Git repository
    the admin sets (git-sync, off until configured).
  namespace: airflow
  deployment: airflow-api-server
  chartRepo: https://airflow.apache.org
  chart: airflow
  version: 1.22.0
  previousVersion: 1.21.0
  releaseName: airflow
  valuesPath: values/airflow/values.yaml
  siteValues:
    sarvaikam: values/airflow/site-sarvaikam.yaml
  extrasPath: extras/airflow
  requires:
  - cloudnative-pg
  accessHint: 'Run setup/airflow-secrets.sh (aio-catalog) before Enable. With a site overlay: https://airflow.<tools
    domain> (sarvaikam: airflow.tools.sarvaikam.com, Keycloak login). Otherwise kubectl -n airflow port-forward
    svc/airflow-api-server 8080:8080 and sign in as admin; password: kubectl -n airflow get secret airflow-secrets
    -o jsonpath=''{.data.admin-password}'' | base64 -d. DAGs: set dags.gitSync (repo, branch, subPath) in values/airflow
    (see its header).'
  probes:
  - name: Airflow API and metadata database
    url: http://airflow-api-server.airflow.svc:8080/api/v2/monitor/health
    expect: '"metadatabase":{"status":"healthy"}'
  - name: Scheduler heartbeat
    url: http://airflow-api-server.airflow.svc:8080/api/v2/monitor/health
    expect: '"scheduler":{"status":"healthy"'
  sso:
    mode: oidc
    clientId: aio-airflow
  license: Apache-2.0
  foundation: Apache
  homepage: https://airflow.apache.org
  pinNote: Chart 1.22.0 ships Airflow 3.2.2 (1.21.0 ships 3.2.0). Images are apache/airflow from Docker Hub, the
    project's official image. The migration and create-user jobs run as Argo CD Sync hooks and are idempotent.
- id: camel-k
  name: Apache Camel K
  category: Workflow
  kind: managed
  phase: '7'
  description: 'Low-code integrations on Kubernetes: Camel routes and Pipes that join 300+ ready-made connectors
    (Kamelets: Kafka, HTTP, databases, SaaS APIs) without writing a service. Installs only the operator (watches
    all namespaces). Integrations run from images the AIO pipeline built; building them in the cluster needs a registry
    set up after Enable (setup/camel-k-registry.sh), off by default. Any cloud; no disks.'
  namespace: camel-k
  deployment: camel-k-operator
  chartRepo: https://apache.github.io/camel-k/charts
  chart: camel-k
  version: 2.11.0
  previousVersion: 2.10.2
  releaseName: camel-k
  valuesPath: values/camel-k/values.yaml
  extrasPath: extras/camel-k
  accessHint: 'kubectl get integrations,pipes -A; kubectl -n camel-k get kamelets. Example Pipe and the registry
    options: values/camel-k/values.yaml (aio-catalog). In-cluster builds: run setup/camel-k-registry.sh after Enable.'
  probes:
  - name: Operator controllers running
    url: http://camel-k-operator-metrics.camel-k.svc:8080/metrics
    expect: controller_runtime_reconcile_total{controller="integration-controller"
  license: Apache-2.0
  foundation: Apache
  homepage: https://camel.apache.org/camel-k
  pinNote: The image is docker.io/apache/camel-k, published by the Apache Camel project. 2.11.0 and 2.10.2 were
    released on the same day (2026-08-31); 2.10.2 is the newest of the previous minor line.
- id: temporal
  name: Temporal
  category: Workflow
  kind: managed
  phase: '7'
  description: Durable workflow execution for long-running business processes, written as code with the Temporal
    SDKs (Go, Java, TypeScript, Python, .NET). One pod each of frontend, history, matching and worker plus the Web
    UI; default and visibility stores on CloudNativePG (no Cassandra or Elasticsearch). Apps connect to temporal-frontend.temporal.svc:7233,
    namespace "default". Web UI with Keycloak login on a site overlay.
  namespace: temporal
  deployment: temporal-frontend
  chartRepo: https://go.temporal.io/helm-charts
  chart: temporal
  version: 1.8.0
  previousVersion: 1.7.0
  releaseName: temporal
  valuesPath: values/temporal/values.yaml
  siteValues:
    sarvaikam: values/temporal/site-sarvaikam.yaml
  extrasPath: extras/temporal
  requires:
  - cloudnative-pg
  accessHint: 'Apps: temporal-frontend.temporal.svc:7233 (gRPC), namespace default. With a site overlay: run setup/temporal-secrets.sh
    with OIDC_CLIENT_SECRET (aio-catalog) before Enable; UI at https://temporal.<tools domain> (sarvaikam: temporal.tools.sarvaikam.com,
    SSO gate + Keycloak login, aio-admin only). Otherwise kubectl -n temporal port-forward svc/temporal-web 8080:8080
    (no login). CLI: kubectl -n temporal exec deploy/temporal-admintools -- temporal operator namespace list'
  probes:
  - name: Temporal frontend API and namespace default
    url: http://temporal-frontend.temporal.svc:7243/api/v1/namespaces/default
    expect: namespaceInfo
  - name: Temporal Web UI
    url: http://temporal-web.temporal.svc:8080/healthz
    expect: OK
  sso:
    mode: oidc
    clientId: aio-temporal
  license: MIT
  foundation: Independent (Temporal Technologies)
  homepage: https://temporal.io
  pinNote: Chart 1.8.0 ships server 1.32.2 and UI 2.56.1 (1.7.0 ships 1.32.0 / 2.54.1); official temporalio/* images
    from Docker Hub. numHistoryShards is 16 and can never change after the first start. Schema and namespace jobs
    are Argo CD Sync hooks and idempotent; on a chart upgrade the schema job updates the schema while the servers
    roll.
  binding:
    label: Temporal workflows
    summary: Connects your Temporal workers and clients to the shared Temporal, namespace default.
    scope: config
    env:
    - name: TEMPORAL_ADDRESS
      value: temporal-frontend.temporal.svc:7233
    - name: TEMPORAL_NAMESPACE
      value: default
    exportNote: Needs Temporal at temporal-frontend.temporal.svc:7233 (connectors/temporal); no TLS or auth in-cluster.
