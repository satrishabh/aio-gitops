# Managed by AIO platform - image.tag is updated by CI / promotions
image:
  repository: ghcr.io/satrishabh/user-profile-manager
  tag: "d5cd7e4d7180"
# 0 until a real image is deployed (avoids pulling the placeholder tag)
replicaCount: 1
containerPort: 8080
# Start Keycloak directly (the image entrypoint re-imports the realm and needs bootstrap-admin and SMTP secrets);
# matches how the Deployment ran before it was recreated from git
command: ["/opt/keycloak/bin/kc.sh"]
args: ["start", "--optimized"]
imagePullSecrets:
  - name: ghcr-pull
pdb:
  enabled: false
ingress:
  enabled: true
  host: user-profile-manager-dev.34.180.3.18.nip.io
env:
  # Matches the Deployment that ran on AKS before it was recreated from git (2026-11-17)
  - name: KC_DB
    value: "postgres"
  - name: KC_DB_SCHEMA
    value: "profile_manager"
  - name: KC_DB_POOL_INITIAL_SIZE
    value: "1"
  - name: KC_DB_POOL_MIN_SIZE
    value: "1"
  - name: KC_DB_POOL_MAX_SIZE
    value: "5"
  - name: KC_HOSTNAME
    value: "https://profile.sarvaikam.com"
  - name: KC_HTTP_ENABLED
    value: "true"
  - name: KC_PROXY_HEADERS
    value: "xforwarded"
  - name: KC_CACHE
    value: "local"
  - name: JAVA_OPTS_APPEND
    value: "-XX:MaxRAMPercentage=65 -XX:InitialRAMPercentage=20"
envFrom:
  - secretRef:
      name: profile-manager-runtime
probes:
  liveness:
    path: /health/live
    initialDelaySeconds: 240   # Keycloak can take minutes to boot on the small AKS nodes (no startup probe in the chart)
  readiness:
    path: /health/ready
    initialDelaySeconds: 30
# Managed by AIO GitOps for the Hostinger-backed custom domain.
routes:
  - host: profile.sarvaikam.com
    path: "/"
    tls: true
    issuer: gts
    certOwner: true
    forceHttps: true
    wwwRedirect: false
    stripPrefix: false
    externalDns: false
# Database TLS trust (same CA as the AIO platform)
extraVolumes:
  - name: trust
    configMap: {name: rehearsal-db-trust}
extraVolumeMounts:
  - {name: trust, mountPath: /etc/aio-db, readOnly: true}
podSecurityContext:
  runAsNonRoot: true
  fsGroup: 1000
  seccompProfile: {type: RuntimeDefault}
resources:
  requests: {cpu: "40m", memory: "512Mi"}
  limits: {cpu: "1000m", memory: "1024Mi"}
spot:
  enabled: true
  provider: aks           # tolerate the AKS spot pool; pods may land there when the regular node is full
