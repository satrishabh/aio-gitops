# Deploys the AIO platform via Argo CD using the shared chart + platform values.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aio-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/satrishabh/aio-gitops.git
    targetRevision: main
    path: helm/app
    helm:
      releaseName: aio-platform
      valueFiles:
        - values.yaml
        - ../../platform/deploy/values-platform.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: aio-platform
  syncPolicy:
    automated: { prune: true, selfHeal: true }
