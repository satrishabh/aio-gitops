apiVersion: v1
kind: Namespace
metadata:
  name: aio-platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aio-platform
  namespace: aio-platform
---
# Least privilege inside the CI namespace: create/watch PipelineRuns, read TaskRuns and step logs
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aio-platform-ci
  namespace: ci
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["tekton.dev"]
    resources: ["taskruns"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aio-platform-ci
  namespace: ci
subjects:
  - kind: ServiceAccount
    name: aio-platform
    namespace: aio-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aio-platform-ci
---
# Environments: the platform owns the shared dev/staging/prod namespaces (labels, default LimitRange,
# ghcr-pull secret) and removes legacy <project>-<env> namespaces. Namespaces are cluster-scoped, so this
# is a ClusterRole; it grants no access to workloads (Argo CD deploys those).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aio-platform-envs
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets", "limitranges"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aio-platform-envs
subjects:
  - kind: ServiceAccount
    name: aio-platform
    namespace: aio-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aio-platform-envs
