apiVersion: v1
kind: Namespace
metadata:
  name: aio-platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aio-platform
  namespace: aio-platform
---
# Least privilege inside the CI namespace: create/watch PipelineRuns, read TaskRuns and step logs
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aio-platform-ci
  namespace: ci
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["tekton.dev"]
    resources: ["taskruns"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aio-platform-ci
  namespace: ci
subjects:
  - kind: ServiceAccount
    name: aio-platform
    namespace: aio-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aio-platform-ci
---
# Hub only. With workload clusters (app.clusters) the platform never touches app workloads directly:
# Argo CD holds the cluster credentials, and pod logs / Rollout promote+abort go through the Argo CD API.
# This role is still needed to (a) prepare dev/staging/prod when an env is hosted on the hub itself
# (single-cluster fallback) and (b) delete legacy <project>-<env> namespaces left on the hub.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aio-platform-envs
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets", "limitranges"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aio-platform-envs
subjects:
  - kind: ServiceAccount
    name: aio-platform
    namespace: aio-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aio-platform-envs
---
# Single-cluster fallback only: detect whether Argo Rollouts is installed on the hub (workload clusters
# declare it with rollouts: true in app.clusters instead)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aio-platform-rollouts-crd
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames: ["rollouts.argoproj.io"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aio-platform-rollouts-crd
subjects:
  - kind: ServiceAccount
    name: aio-platform
    namespace: aio-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aio-platform-rollouts-crd
---
# Connectors page: read-only check that core open-source components are running (by exact Deployment name).
# Managed connectors are installed through Argo CD (project "connectors"), not by this service account.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aio-platform-connectors
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["tekton-pipelines-controller", "argocd-server", "argo-rollouts", "tekton-chains-controller",
                    "kyverno-admission-controller", "cert-manager", "ingress-nginx-controller",
                    "aio-azure-ingress-traefik",
                    # managed connectors whose catalog entry names a deployment (checked by Test)
                    "trivy-operator", "opencost", "goldilocks-controller", "kube-green-controller-manager",
                    "velero", "keda-operator", "descheduler"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aio-platform-connectors
subjects:
  - kind: ServiceAccount
    name: aio-platform
    namespace: aio-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aio-platform-connectors
