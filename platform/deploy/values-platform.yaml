# Helm values for deploying the platform itself with the shared helm/app chart.
# Domain-dependent settings (APP_PUBLIC_URL, APP_BASE_DOMAIN), DB_URL (Cloud SQL by default) and credentials
# come from the aio-platform-secrets Secret, created by bootstrap/gcp-setup.sh.
image:
  # built with Cloud Build into Artifact Registry (same project, so GKE nodes pull it without a secret)
  repository: asia-south1-docker.pkg.dev/project-d28840cd-be2f-4901-85e/aio/aio-platform
  tag: "0.9.0"
replicaCount: 1        # schedulers poll Tekton/Argo; keep 1 replica (no leader election)
serviceAccountName: aio-platform
containerPort: 8080
probes:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 60
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 20
resources:
  requests: { cpu: 100m, memory: 448Mi }
  limits:   { cpu: 900m, memory: 768Mi }
pdb:
  enabled: false
envFrom:
  - secretRef: { name: aio-platform-secrets }
env:
  - { name: APP_REGISTRY, value: "ghcr.io/satrishabh" }
  - { name: ARGOCD_URL, value: "https://argocd-server.argocd.svc" }
  - { name: ARGOCD_INSECURE, value: "true" }
  - { name: GITOPS_REPO_URL, value: "https://github.com/satrishabh/aio-gitops.git" }
  - { name: GITOPS_OWNER, value: "satrishabh" }
  - { name: GITOPS_REPO, value: "aio-gitops" }
  - { name: ALLOWED_USERS, value: "satrishabh" }
  # listed approvers may approve prod requests, including their own (audited as self-approval)
  - { name: APPROVERS, value: "satrishabh" }
  - { name: APP_REGISTRY_USER, value: "satrishabh" }
  # Workload clusters (hub = this cluster runs only the platform, Tekton and Argo CD). Each env maps to exactly
  # one cluster; add clusters with bootstrap/add-cluster.sh, which prints these lines. With none configured,
  # apps keep deploying to this cluster (in-cluster).
  # - { name: APP_CLUSTERS_0_NAME,       value: "aio-nonprod" }
  # - { name: APP_CLUSTERS_0_SERVER,     value: "https://<endpoint>" }
  # - { name: APP_CLUSTERS_0_ENVS,       value: "dev,staging" }
  # - { name: APP_CLUSTERS_0_BASEDOMAIN, value: "<ip>.nip.io" }
  # - { name: APP_CLUSTERS_0_ROLLOUTS,   value: "false" }
  # - { name: APP_CLUSTERS_1_NAME,       value: "aio-prod" }
  # - { name: APP_CLUSTERS_1_SERVER,     value: "https://<endpoint>" }
  # - { name: APP_CLUSTERS_1_ENVS,       value: "prod" }
  # - { name: APP_CLUSTERS_1_BASEDOMAIN, value: "<ip>.nip.io" }
  # - { name: APP_CLUSTERS_1_ROLLOUTS,   value: "true" }
ingress:
  enabled: true
  className: nginx
  host: aio.example.local   # overridden at install time with aio.<ingress-ip>.nip.io
  tls: false
