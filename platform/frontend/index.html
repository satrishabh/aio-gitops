<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIO Platform</title>
    <meta name="description" content="AIO Platform — CI, CD and GitOps from GitHub to production." />
    <meta name="theme-color" content="#F3F4F8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <script>
      // Resolve the theme before first paint so there is no flash. Kept in sync with src/appearance.js.
      (function () {
        var p = 'default'; try { p = localStorage.getItem('aio-theme') || 'default' } catch (e) {}
        if (p === 'light') p = 'default'; if (p === 'system') p = 'auto'
        if (['default', 'bright', 'dark', 'auto'].indexOf(p) === -1) p = 'default'
        var t = p === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default') : p
        document.documentElement.dataset.theme = t
        document.documentElement.style.colorScheme = t === 'dark' ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').setAttribute('content', { default: '#F3F4F8', bright: '#FFFFFF', dark: '#0B0F14' }[t])
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
