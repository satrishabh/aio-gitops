apiVersion: v1
kind: Namespace
metadata:
  name: ci
---
# Runs PipelineRuns
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-runner
  namespace: ci
automountServiceAccountToken: false
# pulls the GHCR-mirrored builder images (tekton/tasks/buildkit-build-push.yaml, kaniko-build-push.yaml)
imagePullSecrets: [{name: ghcr-pull}]
---
# Used by the EventListener to create PipelineRuns
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-triggers-sa
  namespace: ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: triggers-eventlistener-binding
  namespace: ci
subjects:
  - kind: ServiceAccount
    name: tekton-triggers-sa
    namespace: ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: triggers-eventlistener-clusterbinding
subjects:
  - kind: ServiceAccount
    name: tekton-triggers-sa
    namespace: ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
