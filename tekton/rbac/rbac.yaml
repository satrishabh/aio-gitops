apiVersion: v1
kind: Namespace
metadata:
  name: ci
---
# Runs PipelineRuns
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-runner
  namespace: ci
automountServiceAccountToken: false
# Tekton Chains pushes image signatures and provenance with the credentials of the TaskRun's service account.
# Created by bootstrap/install-supply-chain.sh; pods still run if it does not exist yet.
imagePullSecrets:
  - name: registry-signing
---
# Used by the EventListener to create PipelineRuns
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-triggers-sa
  namespace: ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: triggers-eventlistener-binding
  namespace: ci
subjects:
  - kind: ServiceAccount
    name: tekton-triggers-sa
    namespace: ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: triggers-eventlistener-clusterbinding
subjects:
  - kind: ServiceAccount
    name: tekton-triggers-sa
    namespace: ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
