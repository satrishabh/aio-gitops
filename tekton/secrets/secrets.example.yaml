# EXAMPLE ONLY - do not commit real values.
# Prefer creating these from a secret manager (External Secrets Operator / Sealed Secrets / Vault)
# or with the kubectl commands in docs/README.md.
apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
  namespace: ci
type: Opaque
stringData:
  # GHCR:       {"auths":{"ghcr.io":{"auth":"<base64 user:PAT>"}}}
  # Docker Hub: {"auths":{"https://index.docker.io/v1/":{"auth":"<base64 user:token>"}}}
  config.json: '{"auths":{"ghcr.io":{"auth":"REPLACE_ME"}}}'
---
apiVersion: v1
kind: Secret
metadata:
  name: github-token
  namespace: ci
type: Opaque
stringData:
  token: REPLACE_ME   # PAT/App token with contents:write on the GitOps repo
---
apiVersion: v1
kind: Secret
metadata:
  name: github-webhook-secret
  namespace: ci
type: Opaque
stringData:
  secretToken: REPLACE_ME   # same value configured in the GitHub webhook
