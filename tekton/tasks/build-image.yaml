apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-image
spec:
  description: >
    Build and push an image, tagged with the git SHA. With a Dockerfile, rootless BuildKit builds it (no Docker
    daemon, no privileged pod; replaces Kaniko, archived by Google in 2025). Without one,
    Cloud Native Buildpacks (Paketo) detect the language (Java, Node, Go, Python, .NET, ...) and build it,
    so no Dockerfile is needed. BUILD_STRATEGY=auto picks per run. BUILD_STRATEGY=buildah builds the Dockerfile
    with Buildah instead of BuildKit (never chosen by auto; the platform passes it only while the Podman / Buildah
    switch, phase 6, is on). IMAGE_URL/IMAGE_DIGEST are the results
    Tekton Chains looks for to sign the image and attach SLSA provenance; CHAINS-GIT_* tie that provenance
    to the source commit.
  params:
    - name: IMAGE
      description: Full image ref without tag, e.g. ghcr.io/my-org/my-app
    - name: TAG
    - name: DOCKERFILE
      default: ./Dockerfile
      description: Path relative to the repository root
    - name: CONTEXT
      default: "."
    - name: BUILD_STRATEGY
      default: auto
      description: '"auto" (Dockerfile if present, otherwise buildpacks), "dockerfile", "buildpacks" or "buildah" (Dockerfile, built with Buildah)'
    - name: SOURCE_URL
      default: ""
      description: Git URL of the source, recorded in the provenance
    - name: SOURCE_COMMIT
      default: ""
      description: Full commit SHA of the source, recorded in the provenance
  workspaces:
    - name: source
    - name: dockerconfig
      description: Secret containing config.json (registry credentials)
  results:
    - name: IMAGE_DIGEST
    - name: IMAGE_URL
    - name: BUILD_STRATEGY
      description: The strategy actually used ("dockerfile", "buildpacks" or "buildah")
    - name: CHAINS-GIT_URL
    - name: CHAINS-GIT_COMMIT
  volumes:
    - name: cnb-app
      emptyDir: {}
    - name: cnb-layers
      emptyDir: {}
    - name: cnb-platform
      emptyDir: {}
    - name: buildah-storage
      emptyDir: {}
  # Steps cannot be skipped individually, so each build step exits early unless it was chosen.
  # All builder images are pulled on every run; nodes cache them after the first pull.
  steps:
    - name: detect
      image: alpine:3.20
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      env:
        - { name: STRATEGY, value: $(params.BUILD_STRATEGY) }
        - { name: DOCKERFILE, value: $(params.DOCKERFILE) }
      script: |
        #!/bin/sh
        set -eu
        case "$STRATEGY" in
          auto|dockerfile|buildpacks|buildah) ;;
          *) echo "BUILD_STRATEGY must be auto, dockerfile, buildpacks or buildah (got '$STRATEGY')"; exit 1 ;;
        esac
        DF="$(workspaces.source.path)/$DOCKERFILE"
        if [ "$STRATEGY" = auto ]; then
          if [ -f "$DF" ]; then STRATEGY=dockerfile; else STRATEGY=buildpacks; fi
        fi
        if { [ "$STRATEGY" = dockerfile ] || [ "$STRATEGY" = buildah ]; } && [ ! -f "$DF" ]; then
          echo "Dockerfile $DOCKERFILE not found. Add one, or use the buildpacks strategy."; exit 1
        fi
        printf "%s" "$STRATEGY" > "$(results.BUILD_STRATEGY.path)"
        echo "Build strategy: $STRATEGY"

    - name: build-and-push
      # Rootless BuildKit, same image and settings as tasks/buildkit-build-push.yaml: mirrored from
      # moby/buildkit:v0.34.1-rootless (same digest), private GHCR package pulled with ghcr-pull on pipeline-runner
      image: ghcr.io/satrishabh/buildkit:v0.34.1-rootless@sha256:f68752a5a94acfcdad2d07867b7075601a421638e17fc5f28efc1c814d0c4f89
      workingDir: $(workspaces.source.path)
      computeResources:
        requests: { cpu: 100m, memory: 768Mi }   # low request so it fits on busy small nodes; bursts to the limit
        limits: { cpu: 900m, memory: 2Gi }
      # Rootless BuildKit runs as an unprivileged user inside a user namespace. That needs the
      # default seccomp and AppArmor profiles lifted for this container only; it is not privileged.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: Unconfined }
        appArmorProfile: { type: Unconfined }
      env:
        - { name: BUILDKITD_FLAGS, value: --oci-worker-no-process-sandbox }
        # buildctl-daemonless.sh waits for buildkitd with this many tries (default 10). On a freshly autoscaled spot
        # node buildkitd regularly took longer, failing the build with "could not connect to ... buildkitd.sock".
        - { name: BUILDCTL_CONNECT_RETRIES_MAX, value: "60" }
        - { name: DOCKER_CONFIG, value: $(workspaces.dockerconfig.path) }
        # params go in through env, never spliced into the script, so odd values can't inject shell
        - { name: IMAGE, value: $(params.IMAGE) }
        - { name: TAG, value: $(params.TAG) }
        - { name: DOCKERFILE, value: $(params.DOCKERFILE) }
        - { name: CONTEXT, value: $(params.CONTEXT) }
        - { name: SRC, value: $(workspaces.source.path) }
        - { name: STRATEGY_PATH, value: $(results.BUILD_STRATEGY.path) }
        - { name: DIGEST_PATH, value: $(results.IMAGE_DIGEST.path) }
      script: |
        #!/bin/sh
        set -eu
        if [ "$(cat "$STRATEGY_PATH")" != dockerfile ]; then
          echo "Skipped: build strategy is $(cat "$STRATEGY_PATH")."; exit 0
        fi
        CACHE="$IMAGE-cache:buildkit"
        # Dockerfiles declare `ARG AIO_PATCH_DATE` before `RUN apk upgrade`; a new value each day stops the
        # registry cache from serving a stale upgrade layer (see buildkit-build-push.yaml).
        PATCH_DATE=$(date -u +%Y-%m-%d)
        buildctl-daemonless.sh build           --opt build-arg:AIO_PATCH_DATE="$PATCH_DATE"           --frontend dockerfile.v0           --local context="$SRC/$CONTEXT"           --local dockerfile="$SRC/$(dirname "$DOCKERFILE")"           --opt filename="$(basename "$DOCKERFILE")"           --output type=image,name="$IMAGE:$TAG",push=true           --import-cache type=registry,ref="$CACHE"           --export-cache type=registry,ref="$CACHE",mode=max,ignore-error=true           --metadata-file /tmp/metadata.json
        DIGEST=$(grep -o '"containerimage.digest": *"sha256:[0-9a-f]*"' /tmp/metadata.json | grep -o 'sha256:[0-9a-f]*' || true)
        if [ -z "$DIGEST" ]; then echo "no image digest in build metadata:"; cat /tmp/metadata.json; exit 1; fi
        printf "%s" "$DIGEST" > "$DIGEST_PATH"

    - name: buildpacks
      # Paketo noble builder (lifecycle 0.21.22). Pinned; bump deliberately, it decides language runtimes.
      image: docker.io/paketobuildpacks/ubuntu-noble-builder:0.0.203
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001    # CNB_USER_ID of this builder
        runAsGroup: 1001
      computeResources:
        requests: { cpu: 100m, memory: 768Mi }
        limits: { cpu: 900m, memory: 2Gi }
      env:
        - { name: IMAGE, value: $(params.IMAGE) }
        - { name: TAG, value: $(params.TAG) }
        - { name: CONTEXT, value: $(params.CONTEXT) }
        - { name: CNB_PLATFORM_API, value: "0.13" }
        - { name: DOCKER_CONFIG, value: $(workspaces.dockerconfig.path) }   # registry auth for the export and the cache image
      volumeMounts:
        - { name: cnb-app, mountPath: /aio/app }
        - { name: cnb-layers, mountPath: /layers }
        - { name: cnb-platform, mountPath: /platform }
      script: |
        #!/bin/bash
        set -euo pipefail
        if [ "$(cat "$(results.BUILD_STRATEGY.path)")" != buildpacks ]; then
          echo "Skipped: build strategy is $(cat "$(results.BUILD_STRATEGY.path)")."; exit 0
        fi
        # The workspace belongs to uid 65532; the lifecycle runs as 1001 and writes into the app dir,
        # so build from a private copy rather than loosening workspace permissions.
        cp -R "$(workspaces.source.path)/$CONTEXT/." /aio/app/
        rm -rf /aio/app/.git
        /cnb/lifecycle/creator \
          -app=/aio/app -layers=/layers -platform=/platform \
          -cache-image="$IMAGE-cache:buildpacks" \
          -report=/layers/report.toml \
          "$IMAGE:$TAG"
        DIGEST=$(sed -n 's/^ *digest *= *"\(sha256:[0-9a-f]\{64\}\)".*/\1/p' /layers/report.toml | head -1)
        if [ -z "$DIGEST" ]; then echo "No image digest in the lifecycle report:"; cat /layers/report.toml; exit 1; fi
        printf "%s" "$DIGEST" > "$(results.IMAGE_DIGEST.path)"

    - name: buildah
      # Buildah 1.43.5, official image (image built 2026-11-04), pinned by digest (multi-arch index)
      image: quay.io/buildah/stable:v1.43.5@sha256:a6f96bfffc47f36462985573d85e87f782bf2d8b37e02cb3dd307713bfa6cc13
      workingDir: $(workspaces.source.path)
      computeResources:
        requests: { cpu: 100m, memory: 768Mi }
        limits: { cpu: 900m, memory: 2Gi }
      # Rootless Buildah, not privileged. It runs as the image's "build" user (uid 1000, /etc/subuid gives it
      # 1-999 and 1001-65535) and maps those into a user namespace in which it is root; RUN lines execute there
      # under chroot isolation (no runc, no nested container), into vfs storage (no overlay or /dev/fuse needed).
      # - SETUID/SETGID in the bounding set + allowPrivilegeEscalation: newuidmap/newgidmap are file-capability
      #   binaries (cap_setuid/cap_setgid) that write those id maps; without them Buildah can map only uid 1000,
      #   and RUN lines that chown to other users (package installs) fail. Every other capability is dropped:
      #   inside its own user namespace Buildah gets a full capability set that is valid only there.
      # - seccomp/AppArmor Unconfined, for this container only, exactly as rootless BuildKit above: the default
      #   profiles block creating the user namespace and the bind mounts chroot isolation makes inside it.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: true
        capabilities:
          drop: [ALL]
          add: [SETUID, SETGID]
        seccompProfile: { type: Unconfined }
        appArmorProfile: { type: Unconfined }
      env:
        - { name: HOME, value: /home/build }
        - { name: BUILDAH_ISOLATION, value: chroot }
        - { name: STORAGE_DRIVER, value: vfs }
        # same registry credentials as the other builders (the dockerconfig workspace's config.json)
        - { name: REGISTRY_AUTH_FILE, value: $(workspaces.dockerconfig.path)/config.json }
        # params go in through env, never spliced into the script, so odd values can't inject shell
        - { name: IMAGE, value: $(params.IMAGE) }
        - { name: TAG, value: $(params.TAG) }
        - { name: DOCKERFILE, value: $(params.DOCKERFILE) }
        - { name: CONTEXT, value: $(params.CONTEXT) }
        - { name: SRC, value: $(workspaces.source.path) }
        - { name: STRATEGY_PATH, value: $(results.BUILD_STRATEGY.path) }
        - { name: DIGEST_PATH, value: $(results.IMAGE_DIGEST.path) }
      volumeMounts:
        - { name: buildah-storage, mountPath: /home/build/.local/share/containers }   # graphroot of rootless storage
      script: |
        #!/bin/bash
        set -euo pipefail
        if [ "$(cat "$STRATEGY_PATH")" != buildah ]; then
          echo "Skipped: build strategy is $(cat "$STRATEGY_PATH")."; exit 0
        fi
        buildah --version
        # Short image names (FROM maven:3.9, node:22) resolve to Docker Hub, as with BuildKit and Kaniko. The stock
        # image lists several search registries in enforcing mode, which needs a TTY prompt and fails in CI.
        mkdir -p "$HOME/.config/containers"
        cat > "$HOME/.config/containers/registries.conf" <<'CONF'
        unqualified-search-registries = ["docker.io"]
        short-name-mode = "permissive"
        CONF
        # Same daily build arg as BuildKit, so Dockerfiles that declare it behave identically.
        # --format docker: like BuildKit's image output (Docker media types); OCI format would drop HEALTHCHECK/SHELL.
        PATCH_DATE=$(date -u +%Y-%m-%d)
        buildah --storage-driver=vfs build \
          --isolation=chroot \
          --format=docker \
          --authfile="$REGISTRY_AUTH_FILE" \
          --build-arg=AIO_PATCH_DATE="$PATCH_DATE" \
          --file="$SRC/$DOCKERFILE" \
          --tag="$IMAGE:$TAG" \
          "$SRC/$CONTEXT"
        buildah --storage-driver=vfs push \
          --authfile="$REGISTRY_AUTH_FILE" \
          --digestfile=/tmp/digest \
          "$IMAGE:$TAG" "docker://$IMAGE:$TAG"
        DIGEST=$(grep -o 'sha256:[0-9a-f]\{64\}' /tmp/digest | head -1 || true)
        if [ -z "$DIGEST" ]; then echo "No image digest from buildah push:"; cat /tmp/digest || true; exit 1; fi
        printf "%s" "$DIGEST" > "$DIGEST_PATH"

    - name: write-url
      image: alpine:3.20
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      env:
        - { name: IMAGE, value: $(params.IMAGE) }
        - { name: TAG, value: $(params.TAG) }
        - { name: SOURCE_URL, value: $(params.SOURCE_URL) }
        - { name: SOURCE_COMMIT, value: $(params.SOURCE_COMMIT) }
      script: |
        #!/bin/sh
        set -eu
        grep -q '^sha256:[0-9a-f]\{64\}$' "$(results.IMAGE_DIGEST.path)" || { echo "Build produced no image digest"; exit 1; }
        printf "%s" "$IMAGE:$TAG" > "$(results.IMAGE_URL.path)"
        printf "%s" "$SOURCE_URL" > "$(results.CHAINS-GIT_URL.path)"
        printf "%s" "$SOURCE_COMMIT" > "$(results.CHAINS-GIT_COMMIT.path)"
        echo "Pushed $IMAGE:$TAG@$(cat "$(results.IMAGE_DIGEST.path)")"
