apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
spec:
  description: >
    Clone a git repository at a specific revision into the source workspace. With the optional github-token
    workspace bound, private repositories the token can read are cloned too (security scans of any repo).
  params:
    - name: url
      type: string
    - name: revision
      type: string
      default: main
  workspaces:
    - name: source
    - name: github-token
      description: Optional secret with key "token" for private repositories
      optional: true
      readOnly: true
  results:
    - name: commit
      description: Full commit SHA that was checked out
    - name: short-sha
      description: 12-char commit SHA used as image tag
  steps:
    - name: clone
      image: alpine/git:2.45.2
      workingDir: $(workspaces.source.path)
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      env:
        - name: HOME
          value: /tmp
      script: |
        #!/bin/sh
        set -eu
        git config --global --add safe.directory "$(workspaces.source.path)"
        rm -rf ./* ./.[!.]* 2>/dev/null || true
        git init -q .
        git remote add origin "$(params.url)"
        # The token is sent as a header for this fetch only - never written to .git/config, so it is not left
        # in the workspace (where a secret scan would find it) and never appears in the remote URL or logs.
        AUTH=""
        if [ "$(workspaces.github-token.bound)" = "true" ] && [ -s "$(workspaces.github-token.path)/token" ]; then
          AUTH="Authorization: Basic $(printf 'x-access-token:%s' "$(cat "$(workspaces.github-token.path)/token")" | base64 | tr -d '\n')"
        fi
        if [ -n "$AUTH" ]; then
          git -c http.extraHeader="$AUTH" fetch -q --depth 1 origin "$(params.revision)"
        else
          git fetch -q --depth 1 origin "$(params.revision)"
        fi
        unset AUTH
        git checkout -q FETCH_HEAD
        SHA=$(git rev-parse HEAD)
        printf "%s" "$SHA" > "$(results.commit.path)"
        printf "%s" "$(echo "$SHA" | cut -c1-12)" > "$(results.short-sha.path)"
        echo "Checked out $SHA"
