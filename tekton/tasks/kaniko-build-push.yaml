apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: kaniko-build-push
spec:
  description: >
    Build an image from any Dockerfile with Kaniko (no Docker daemon, works on any
    Kubernetes cluster/cloud) and push it to GHCR / Docker Hub / any OCI registry.
  params:
    - name: IMAGE
      description: Full image ref without tag, e.g. ghcr.io/my-org/my-app or docker.io/myuser/my-app
    - name: TAG
    - name: DOCKERFILE
      default: ./Dockerfile
    - name: CONTEXT
      default: "."
    - name: EXTRA_ARGS
      type: array
      default: []
  workspaces:
    - name: source
    - name: dockerconfig
      description: Secret containing config.json (registry credentials)
      mountPath: /kaniko/.docker
  results:
    - name: IMAGE_DIGEST
    - name: IMAGE_URL
  steps:
    # Kaniko v1.23.2 with --cache loses COPY --from files of a multi-stage build when the earlier
    # stage's RUN layer is restored from cache ("lstat /kaniko/0/workspace/app.jar: no such file").
    # Any re-run of the same commit hits this. So: try with the cache; if that fails, the next step
    # builds again without it in a fresh container. A genuine build error fails both, so the task fails.
    - name: build-and-push
      # mirrored from gcr.io/kaniko-project/executor:v1.23.2 (same digest) so CI has no Google dependency;
      # private GHCR package, pulled with the ghcr-pull secret on SA pipeline-runner
      image: ghcr.io/satrishabh/kaniko-executor:v1.23.2@sha256:9e69fd4330ec887829c780f5126dd80edc663df6def362cd22e79bcdf00ac53f
      onError: continue
      workingDir: $(workspaces.source.path)
      computeResources:
        requests: { cpu: 100m, memory: 768Mi }   # low request so it fits on busy small nodes; bursts to the limit
        limits: { cpu: 900m, memory: 2Gi }   # sized for 2-vCPU / 8 GiB nodes (AKS B2as_v2)
      args:
        - --dockerfile=$(params.DOCKERFILE)
        - --context=$(workspaces.source.path)/$(params.CONTEXT)
        - --destination=$(params.IMAGE):$(params.TAG)
        - --digest-file=$(results.IMAGE_DIGEST.path)
        - --cache=true
        - --cache-repo=$(params.IMAGE)-cache
        - --snapshot-mode=redo
        - $(params.EXTRA_ARGS[*])
    - name: build-and-push-nocache
      # mirrored from gcr.io/kaniko-project/executor:v1.23.2-debug: same executor plus busybox, for the exit-code check
      image: ghcr.io/satrishabh/kaniko-executor:v1.23.2-debug@sha256:c3109d5926a997b100c4343944e06c6b30a6804b2f9abe0994d3de6ef92b028e
      workingDir: $(workspaces.source.path)
      computeResources:
        requests: { cpu: 100m, memory: 768Mi }
        limits: { cpu: 900m, memory: 2Gi }
      script: |
        #!/busybox/sh
        set -eu
        if [ "$(cat $(steps.step-build-and-push.exitCode.path))" = "0" ]; then
          echo "cached build succeeded"; exit 0
        fi
        echo "cached build failed; building again without the layer cache"
        exec /kaniko/executor "$@"
      args:
        - --dockerfile=$(params.DOCKERFILE)
        - --context=$(workspaces.source.path)/$(params.CONTEXT)
        - --destination=$(params.IMAGE):$(params.TAG)
        - --digest-file=$(results.IMAGE_DIGEST.path)
        - --cache=false
        - --snapshot-mode=redo
        - $(params.EXTRA_ARGS[*])
    - name: write-url
      image: alpine:3.20
      script: |
        #!/bin/sh
        printf "%s" "$(params.IMAGE):$(params.TAG)" > "$(results.IMAGE_URL.path)"
