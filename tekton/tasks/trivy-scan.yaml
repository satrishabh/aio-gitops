apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: trivy-scan
spec:
  description: >
    Scan the pushed image. Emits SUMMARY (critical=N,high=N,medium=N,low=N) for the portal,
    then fails the pipeline on findings at or above SEVERITY.
  params:
    - name: IMAGE_URL
    - name: SEVERITY
      default: HIGH,CRITICAL
    - name: IGNORE_UNFIXED
      default: "true"
  results:
    - name: SUMMARY
      description: Vulnerability counts by severity
  workspaces:
    - name: dockerconfig
      mountPath: /root/.docker
  volumes:
    # DB cache lives on the node so the ~1 GB Java DB (4+ min download) is fetched once per node, not every run.
    # Trivy refreshes it itself when it goes stale (vuln DB ~6h, Java DB ~3 days).
    - name: trivy-cache
      hostPath:
        path: /var/lib/aio-trivy-cache
        type: DirectoryOrCreate
    - name: scratch
      emptyDir: {}
  stepTemplate:
    image: aquasec/trivy:0.54.1
    env:
      - name: DOCKER_CONFIG
        value: /root/.docker
      - name: TRIVY_CACHE_DIR
        value: /cache
    volumeMounts:
      - name: trivy-cache
        mountPath: /cache
      - name: scratch
        mountPath: /scratch
    computeResources:
      requests: { cpu: 100m, memory: 384Mi }
      limits: { cpu: 900m, memory: 1536Mi }
  steps:
    - name: summarize
      script: |
        #!/bin/sh
        set -eu
        FLAGS=""
        [ "$(params.IGNORE_UNFIXED)" = "true" ] && FLAGS="--ignore-unfixed"
        trivy image --no-progress --exit-code 0 $FLAGS --format json --output /scratch/report.json "$(params.IMAGE_URL)"
        count() { grep -c "\"Severity\": \"$1\"" /scratch/report.json || true; }
        printf "critical=%s,high=%s,medium=%s,low=%s" \
          "$(count CRITICAL)" "$(count HIGH)" "$(count MEDIUM)" "$(count LOW)" > "$(results.SUMMARY.path)"
        cat "$(results.SUMMARY.path)"; echo
    - name: gate
      script: |
        #!/bin/sh
        set -eu
        if [ "$(params.SEVERITY)" = "NONE" ] || [ -z "$(params.SEVERITY)" ]; then
          echo "Gate disabled (SEVERITY=NONE) - findings reported only."
          exit 0
        fi
        FLAGS=""
        [ "$(params.IGNORE_UNFIXED)" = "true" ] && FLAGS="--ignore-unfixed"
        trivy image --no-progress --skip-db-update --skip-java-db-update --exit-code 1 $FLAGS \
          --severity "$(params.SEVERITY)" "$(params.IMAGE_URL)"
