apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: update-gitops
spec:
  description: >
    Bump image.repository/image.tag in a Helm values file inside the GitOps repo and push.
    Argo CD picks up the commit and syncs the environment.
  params:
    - name: GITOPS_REPO
      description: HTTPS URL of the GitOps repo, e.g. https://github.com/my-org/gitops.git
    - name: GITOPS_BRANCH
      default: main
    - name: VALUES_FILE
      description: Path in GitOps repo, e.g. helm/app/values-dev.yaml
    - name: IMAGE
    - name: TAG
    - name: APP_NAME
  workspaces:
    - name: github-token
      description: Secret with key "token" (GitHub PAT / App token with contents:write)
      mountPath: /secrets/github
  steps:
    - name: bump
      image: alpine/git:2.45.2
      env:
        - name: HOME
          value: /tmp
      script: |
        #!/bin/sh
        set -eu
        apk add --no-cache yq >/dev/null 2>&1 || \
          (wget -qO /tmp/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 && chmod +x /tmp/yq && export PATH=/tmp:$PATH)
        TOKEN=$(cat /secrets/github/token)
        REPO_NO_PROTO=$(echo "$(params.GITOPS_REPO)" | sed 's#^https://##')
        cd /tmp
        git clone -q --depth 1 -b "$(params.GITOPS_BRANCH)" "https://x-access-token:${TOKEN}@${REPO_NO_PROTO}" gitops
        cd gitops
        git config user.name  "tekton-ci"
        git config user.email "tekton-ci@noreply.local"
        export IMG="$(params.IMAGE)" TAG="$(params.TAG)"
        BRANCH="$(params.GITOPS_BRANCH)"
        # Several projects deploy at once and race on the same branch. On a rejected push, do not
        # rebase (the clone is shallow, so a rebase can fail and set -e would end the step): reset to
        # the new remote tip and re-apply the edit, which is idempotent.
        for i in 1 2 3 4 5 6 7 8; do
          yq -i '.image.repository = strenv(IMG) | .image.tag = strenv(TAG)' "$(params.VALUES_FILE)"
          # envs start at 0 replicas until a real image exists; first real deploy scales to 1
          # (unless the env was scaled down on purpose from the portal: scaledDown: true)
          yq -i 'with(select((.replicaCount // 0) == 0 and (.scaledDown // false) != true); .replicaCount = 1)' "$(params.VALUES_FILE)"
          if git diff --quiet; then echo "No change"; exit 0; fi
          git commit -qam "ci($(params.APP_NAME)): deploy $(params.TAG) to $(params.VALUES_FILE)"
          if git push -q origin "$BRANCH"; then exit 0; fi
          echo "push rejected (attempt $i); re-syncing with origin/$BRANCH"
          sleep $(( i * 2 + $(od -An -N1 -tu1 /dev/urandom) % 5 ))   # back off with jitter
          git fetch -q --depth 1 origin "$BRANCH" && git reset -q --hard FETCH_HEAD || true
        done
        echo "push failed after 8 attempts"; exit 1
